    <tr><td class="mo">1</td><td class="lb">Task Type</td><td>태스크 유형 분류</td><td>2번 노드</td></tr>
    <tr class="hi"><td class="mo">2</td><td class="lb">Target Column</td><td>타겟 컬럼 선택</td><td>${a('rank','기여도 순위')}의 전제</td></tr>
    <tr><td class="mo">3</td><td class="lb">Column Role</td><td>힌트 / 정답 / ${a('idx','순번')} / 불필요</td><td>${a('csm','CSM')} 제거 대상</td></tr>
    <tr><td class="mo">4</td><td class="lb">Target Type</td><td>정답의 형태 판별</td><td>5번 노드</td></tr>
    <tr class="hi"><td class="mo">5</td><td class="lb">Semantic</td><td>${a('semantic4','네 관점')} 설명 생성</td><td><b>${a('ctx','Context')}</b></td></tr>
    <tr><td class="mo">6</td><td class="lb">Quick Eval</td><td>검증 실험 설계</td><td>10번 노드</td></tr>
    <tr><td class="mo">7</td><td class="lb">Dataset Name</td><td>데이터셋 이름 생성</td><td>8번 노드</td></tr>
    <tr><td class="mo">8</td><td class="lb">Integrity Diag</td><td>중복, 타입 불일치</td><td><b>${a('integ','Integrity')}</b></td></tr>
    <tr><td class="mo">9</td><td class="lb">Conciseness Diag</td><td>중복 피처, 낮은 관련성</td><td><b>${a('consis','Consistency')}</b></td></tr>
    <tr><td class="mo">10</td><td class="lb">Contextuality Diag</td><td>커버리지, 목표 정합성</td><td><b>Context</b></td></tr>
    <tr class="hi"><td class="mo">11</td><td class="lb">Input Sufficiency</td><td>목적과 데이터가 맞는지</td><td><b>Context</b></td></tr>
  </table>
  <div class="stack">
    <div class="card bad"><span class="k r">문제 2 · 도메인 지식의 부재</span>
      <p class="tx sm" style="margin-top:2px">11개 모두 <b>통계와 형식만</b> 봅니다. 이 데이터가 어느 업종에서 나왔는지 파악하는 에이전트가 <b>하나도 없습니다.</b> <b>의도</b>는 "매출 예측 할 거야"이고 <b>도메인</b>은 "이건 동네 카페 매출이야"인데, 지금 받는 건 앞의 것뿐입니다.</p></div>
    <div class="ex"><span class="exk">하루 매출 10만 원</span>
      <p>에이전트들은 수학만 하니 "평균 10만 원, 이상 없음"으로 넘어갑니다. 그런데 <b>벤츠 대리점</b>이면 심각한 오류이고 <b>동네 붕어빵 가게</b>면 아주 정상입니다.</p></div>
  </div>
</div>`},

/* 14 ─ 5.1 */
{sec:'5장 · 전처리', title:'6개 모듈은 각각 어떤 문제를 푸나', part:3, src:'5.1',
why:'모듈 여섯 개가 각각 어떤 AI 문제를 푸는지 한눈에 봅니다.',
impact:'이 표가 16장부터의 상세 설명과 26장 지도로 이어집니다.', html:`
<div class="hd cw">
  <span class="eb">5.1 모듈 6개</span>
  <h2>6개 모듈은 각각 어떤 문제를 푸나</h2>
  <p class="lead">진단이 끝나면 결함을 보완할 6가지(수정 5 + 질문 1)가 추천됩니다. 시스템은 <b>추천만</b> 하고 실제로 바뀌는 것은 클릭한 항목뿐입니다.</p>
</div>
<div class="cw">
  <table class="sm">
    <tr><th style="width:48px">모듈</th><th style="width:288px">어떤 AI 문제를 푸나</th><th>보완 방식과 임계값</th><th style="width:38px">장</th></tr>
    <tr><td class="lb">${a('fnm','FNM')}</td><td>빈칸은 학습 시 데이터 누락과 <b>연산 에러</b>를 유발합니다</td><td>신호 컬럼을 만들고 중간값·최빈값으로 대치. 결측률 <b>30% 초과 무조건</b>, 중요한 열은 <b>1%</b>(중간 5, 낮음 10)</td><td class="mo">16</td></tr>
    <tr><td class="lb">${a('ivm','IVM')}</td><td>튀는 값과 쏠린 분포는 예측 패턴을 <b>편향</b>시킵니다</td><td>잘라내기·로그 변환·${a('catmerge','범주 통합')}·정규화. <b>왜도 2.0 초과</b>이거나 범위 밖 값 <b>5% 초과</b></td><td class="mo">17</td></tr>
    <tr><td class="lb">${a('csm','CSM')}</td><td>무관한 항목은 불필요한 규칙을 외우게(<b>노이즈</b>) 만듭니다</td><td>중요도가 낮거나 ${a('leak','타겟 누수')}가 있거나 정보가 겹치는 열을 제거. 임계값 <b>미확인</b></td><td class="mo">18</td></tr>
    <tr><td class="lb">${a('cam','CAM')}</td><td>종류가 방대한 텍스트는 <b>그룹화하기 어렵습니다</b></td><td>${a('cardi','카디널리티')}가 높은 범주형을 단일 숫자로. ${a('bte','BTE')}는 정답 연관도, ${a('freq','Frequency')}는 등장 횟수</td><td class="mo">19</td></tr>
    <tr><td class="lb">${a('ram','RAM')}</td><td>타겟 비율이 극단적이면 <b>다수결에 의존하는 꼼수</b>를 부립니다</td><td>${a('cart','CART')} 방식으로 부족한 클래스를 가상 생성해 균형을 맞춥니다</td><td class="mo">20</td></tr>
    <tr class="hi"><td class="lb">${a('ipm','IPM')}</td><td>의미를 모르면 AI가 <b>적절한 가중치를 주지 못합니다</b></td><td>사용자에게 목적과 컬럼 의미를 질문해 메타데이터에 채웁니다. <b>값이 아니라 설명을 채우는 역할</b></td><td class="mo">26</td></tr>
  </table>
  <div class="bn v" style="margin-top:15px"><b>표를 건드리는 방식이 넷으로 갈립니다.</b> 칸을 바꾸거나(FNM·IVM), 열을 줄이거나(CSM), 열의 성질을 바꾸거나(CAM), 행을 늘립니다(RAM).
    그리고 IPM만 <b>표를 한 칸도 안 건드립니다.</b> 그런데 점수를 확실히 올리는 건 그 IPM 하나뿐입니다.</div>
</div>`},

/* 15 ─ 5.2 */
{sec:'5장 · 전처리', title:'어떻게 "이걸 해야 한다"고 판정하나', part:3, src:'5.2 · 7.3',
why:'추천 여부를 정하는 규칙과 실행 순서를 봅니다.',
impact:'RAM이 맨 마지막이라는 <b>문제 10</b>이 24장 점수 하락의 구조적 원인입니다.', html:`
<div class="hd cw">
  <span class="eb">5.2 판정 로직</span>
  <h2>어떻게 "이걸 해야 한다"고 판정하나</h2>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="mb" style="font-size:11.6px; line-height:1.86">[1단계] 컬럼 하나하나 판정
   컬럼 A는 FNM 필요? → 예
   컬럼 C는 IVM 필요? → 예
        ▼
[2단계] 모듈 단위로 모음
   <span class="dn">컬럼 중 하나라도 걸리면 → 모듈 "필요"</span>
        ▼
[3단계] 화면에 표시
   FNM → "pending" <span class="mu">(누를 수 있는 상태)</span>
   IVM → "skipped" <span class="mu">(건너뜀)</span>
        ▼
   <span class="up">사용자가 클릭 → 실제 실행</span></div>
    <div class="qa">
      <div class="q">판정 기준은 왜 중요한가요?</div>
      <p class="an-a">단 1개라도 조건을 충족하면 모듈 전체가 추천으로 전환되기 때문입니다. 기준이 너무 낮으면 <b>사소한 결함 하나로 무의미한 모듈이 계속 pending으로</b> 뜨고, 추천의 신뢰도가 떨어집니다. 기준은 사용자가 꼭 필요한 의사결정만 내리도록 돕는 <b>필터</b>입니다.</p>
    </div>
  </div>
  <div class="stack">
    <div class="card"><span class="k">실행 순서는 고정입니다</span>
      <div class="mb" style="margin-top:11px; font-size:11.6px; line-height:1.9; padding:14px 16px">FNM <span class="mu">빈칸을 먼저 없앤다</span>
 ↓  <span class="mu">뒤 계산이 빈칸에서 깨지지 않도록</span>
IVM <span class="mu">값의 범위를 정리한다</span>
 ↓  <span class="mu">상관이 이상치에 끌려가지 않도록</span>
CSM <span class="mu">필요 없는 열을 지운다</span>
 ↓  <span class="mu">남은 열만 대상으로</span>
CAM <span class="mu">남은 범주형을 숫자로 바꾼다</span>
 ↓  <span class="mu">열 구성이 확정된 뒤에</span>
<span class="dn">RAM</span> <span class="mu">마지막으로 행을 늘린다</span></div></div>
    <div class="card bad"><span class="k r">문제 10 · 순서 고정</span>
      <p class="tx sm" style="margin-top:2px">RAM이 <b>가장 마지막</b>이라 RAM이 만든 부작용(중복행 증가)을 정리할 방법이 없습니다. 중복 제거를 RAM 앞에 놓아야 하지만 <b>지금은 중복 제거 자체가 없습니다.</b> 순서를 바꾸는 것도 다른 부작용을 만들 수 있어(컬럼을 먼저 지우면 채울 대상이 사라짐) 단순한 문제는 아닙니다.</p></div>
  </div>
</div>`},

/* 16 ─ 5.3 FNM */
{sec:'5장 · 전처리', title:'빈칸이 있으면 무조건 채우나요', part:3, src:'5.3',
why:'숫자 기준이 명확한 두 모듈 중 첫 번째입니다.',
impact:'빈칸 문제를 제대로 풀려면 <b>사람에게 묻는 기능</b>이 필요하다는 결론으로 이어집니다.', html:`
<div class="hd cw">
  <span class="eb">5.3 FNM</span>
  <h2>빈칸이 있으면 무조건 채우나요</h2>
  <p class="lead">아닙니다. <b>중요한 열일수록 깐깐하게</b> 봅니다.</p>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="card"><span class="k v">판정 기준</span>
      <ul class="li" style="margin-top:11px">
        <li><b>30% 넘게 비었으면 무조건 처리.</b> 3분의 1 이상이면 어차피 쓸 수 없는 상태라는 판단입니다</li>
        <li><b>중요한 열은 1%만 비어도 처리.</b> 결정적인 컬럼이니 빈칸 하나도 아깝다는 뜻입니다(${a('rank','기여도')} high 0.01)</li>
        <li><b>안 중요한 열은 10%까지 봐줍니다.</b> 굳이 손대서 원본을 훼손하지 않겠다는 뜻입니다(medium 0.05, low 0.10)</li>
        <li>기여도를 아직 알 수 없는 컬럼은 그냥 넘어갑니다</li>
      </ul>
      <p class="tx sm mutetx" style="margin-top:12px">여기서 중요도는 절대 기준이 아니라 <b>순위</b>입니다. CSM으로 열을 지우면 남은 열의 등수가 올라가기 때문에 25장에서 사고가 납니다.</p></div>
    <div class="qa">
      <div class="q">중간값으로 대치하면 전체 통계가 왜곡되지 않나요?</div>
      <p class="an-a"><b>왜곡되는 것이 맞습니다.</b> 그럼에도 쓰는 이유는 대부분의 모델이 결측치가 하나만 있어도 <b>연산 에러</b>를 내기 때문입니다. 행을 통째로 지우면 유실이 너무 크니 우선 채웁니다.</p>
      <p class="an-a">이때 생기는 왜곡은 <b>신호 컬럼(<span class="mono">{col}_is_null</span>)</b>을 함께 만들어 통제합니다. "원래 비어 있던 데이터"라는 사실을 독립적인 정보로 넘겨주면, AI가 실제 값과 채워진 값을 <b>구분해서</b> 학습합니다.</p>
    </div>
  </div>
  <div class="card bad"><span class="k r">문제 3 · 빈칸을 채우는 게 항상 좋은 일은 아닙니다</span><div class="h3">빈칸이 그 자체로 정보일 수 있다</div>
    <p class="tx">"해지 사유" 컬럼이 비어 있다면 그건 누락이 아니라 <b>그 고객이 해지를 안 했다</b>는 뜻일 수 있습니다. 중간값으로 채우면 없던 사실을 만들어내는 셈입니다.</p>
    <p class="quo">회의 발언. <b>"결측치 처리를 함으로써 원래 성능이 낮아지는 경우도 있다"</b></p>
    <p class="tx">지금 시스템은 이걸 구분하지 못합니다. 구분하려면 빈칸이 <b>왜</b> 비어 있는지를 알아야 하는데, 그건 데이터만 봐서는 알 수 없고 사용자에게 물어봐야 합니다.</p>
    <p class="tx"><b>즉 빈칸 문제를 제대로 풀려면 데이터를 고치는 게 아니라 사람에게 묻는 기능이 필요합니다.</b> ${a('ipm','IPM')}과 28장 쟁점 1의 C안으로 이어집니다.</p></div>
</div>`},

/* 17 ─ 5.4 IVM */
{sec:'5장 · 전처리', title:'왜 하필 왜도 2.0이고 이상치 5%인가요', part:3, src:'5.4',
why:'값을 다듬는 기준과 실제 연산 네 가지를 함께 봅니다.',
impact:'실측 ML 0건이라는 결과가 <b>범용 전처리 축소 논의의 출발점</b>입니다.', html:`
<div class="hd cw">
  <span class="eb">5.4 IVM</span>
  <h2>왜 하필 왜도 2.0이고 이상치 5%인가요</h2>
  <p class="lead">둘 다 <b>정말 심한 것만 손대겠다는 보수적인 선</b>입니다. 두 조건 중 하나만 맞아도 실행됩니다.</p>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="card"><span class="k v">기준과 네 가지 연산</span>
      <ul class="li" style="margin-top:11px">
        <li><b>${a('skew','왜도')} 절댓값 &gt; 2.0</b> → ${a('logt','로그 변환')}으로 긴 꼬리를 눌러 폅니다. 2.0은 통계학 법칙이 아니라 <b>업계 경험치</b>이고 증명된 값이 아닙니다</li>
        <li><b>${a('outlier','이상치')} 비율 &gt; 5%</b> → ${a('clip','클리핑')}으로 끝값에서 자릅니다. 정상 범위는 ${a('iqr','IQR fence')}로 정하고, 5%는 정상 데이터를 계속 건드리지 않으려는 선입니다</li>
        <li><b>${a('catmerge','범주 통합')}</b> · 등장 횟수가 너무 적은 자잘한 항목을 기타로 묶습니다</li>
        <li><b>${a('scale','스케일 정규화')}</b> · 단위가 다른 컬럼들의 출발선을 0~1로 맞춥니다</li>
      </ul></div>
    <div class="ex"><span class="exk">비율을 셀 때 분모에 빈칸을 넣지 않는 이유</span>
      <p>제품 100개 중 <b>80개는 검사 기록이 없고</b>, 검사한 20개 중 10개가 불량이라고 해봅시다.</p>
      <p><b>빈칸을 넣으면</b> 10 ÷ 100 = 10%. 검사도 안 한 80개가 섞여 <b>불량률이 희석</b>되고 시스템은 정상이라 오판합니다.</p>
      <p><b>빈칸을 빼면</b> 10 ÷ 20 = <b>50%</b>. 빈칸은 정상이 아니라 <b>알 수 없음</b>이니 빼야 진짜 심각성이 드러납니다.</p></div>
  </div>
  <div class="card bad"><span class="k r">문제 4 · 왜도가 크다고 나쁜 데이터인 건 아닙니다</span><div class="h3">세상이 원래 그런 모양이다</div>
    <p class="tx">연봉 데이터는 원래 왜도가 큽니다. 지진 규모, 도시 인구, 상품 판매량 다 그렇습니다. 데이터가 망가진 게 아닙니다.</p>
    <p class="quo">회의에서 가장 날카로웠던 지적. <b>"왜도를 개선해서 0에 가까워졌다고 좋은 데이터냐, 그것도 아닌 것 같다"</b></p>
    <p class="tx">실측이 이 지적을 뒷받침합니다. 결함 16종 실험에서 <b>IVM이 ${a('tree','트리 계열 ML')} 성능을 올린 경우는 0건</b>, 반대로 LLM이 읽는 경우에는 9건에서 좋아졌습니다.</p>
    <p class="tx"><b>대상이 ML이냐 LLM이냐에 따라 정답이 갈리는 모듈</b>입니다. "왜도 처리도 사실은 빠져야 되는 게 맞다"는 발언이 나왔으나 결정된 사항은 아닙니다.</p></div>
</div>`},

/* 18 ─ 5.5 CSM */
{sec:'5장 · 전처리', title:'CSM은 무엇을 보고 열을 지우나', part:3, src:'5.5',
why:'무엇을 근거로 열을 삭제 대상으로 고르는지 확인합니다.',
impact:'열이 줄면 남은 열의 등수와 평균이 함께 움직입니다. 25장의 출발점입니다.', html:`
<div class="hd cw">
  <span class="eb">5.5 CSM</span>
  <h2>CSM은 무엇을 보고 열을 지우나</h2>
  <p class="lead">판정 재료는 확인되었지만 <b>구체적 임계값은 미확인</b>입니다. 발표 자료에 숫자가 실려 있지 않습니다.</p>
</div>
<div class="cw g2">
  <div class="card"><span class="k v">세 가지 삭제 사유</span>
    <div class="step"><span class="sn">1</span><div class="tx sm" style="margin-top:0"><b>중요도가 낮은 열.</b> ${a('rank','중요도 순위')}, 기여 강도, 컬럼 신뢰도가 낮으면 대상입니다. useless 딱지가 붙은 열과 ${a('idx','단순 순번 컬럼')}도 포함됩니다</div></div>
    <div class="step"><span class="sn">2</span><div class="tx sm" style="margin-top:0"><b>${a('leak','타겟 누수')}.</b> 정답과의 상관이 <b>과도하게</b> 높으면 정답이 새어 들어간 것으로 봅니다</div></div>
    <div class="step"><span class="sn">3</span><div class="tx sm" style="margin-top:0"><b>${a('colin','다중공선성')}.</b> 다른 컬럼과 상관이 높은 것끼리 묶어 대표 하나만 남깁니다. '태어난 연도'와 '나이'가 둘 다 있으면 AI가 그 정보의 중요도를 <b>2배로 부풀려 착각</b>합니다</div></div></div>
  <div class="stack">
    <div class="qa">
      <div class="q">힌트가 많을수록 좋은 거 아닌가요?</div>
      <p class="an-a">상식적으로는 맞습니다. 하지만 타겟 누수는 좋은 힌트가 아니라 <b>미래의 정답지를 훔쳐보는 부정행위</b>에 가깝습니다.</p>
      <p class="an-a">내일 비가 올지 예측한다고 해봅시다. 좋은 힌트는 오늘의 구름 양과 습도입니다. 그런데 <b>'내일 우산 판매량'</b>이 섞여 있으면, 과거 데이터에서 상관이 99%로 나오니 AI는 "우산 판매량만 보면 되겠네"라고 배웁니다.</p>
      <p class="an-a"><b>그런데 오늘 시점에서 내일 우산이 몇 개 팔릴지는 알 수가 없습니다.</b> 실전에서는 아무 쓸모 없는 AI가 됩니다.</p>
    </div>
    <div class="bn r"><b>지우고 나면 무슨 일이 생기나.</b> 남은 열의 등수가 저절로 올라가고, 지워진 열이 대체로 상관이 낮았던 열이라 <b>남은 열끼리의 평균 상관은 오히려 올라갑니다.</b> 25장에서 계산으로 따라갑니다.</div>
  </div>
</div>`},

/* 19 ─ 5.5 CAM */
{sec:'5장 · 전처리', title:'상품코드 3,000종을 어떻게 할까요', part:3, src:'5.5',
why:'문자로 된 열을 어떤 방식으로 숫자 하나로 바꾸는지 봅니다.',
impact:'실측에서 <b>ML과 LLM 양쪽 모두 좋았던 유일한 모듈</b>입니다.', html:`
<div class="hd cw">
  <span class="eb">5.5 CAM</span>
  <h2>상품코드 3,000종을 어떻게 할까요</h2>
  <p class="lead">단순한 고유 식별자는 앞선 CSM에서 이미 걸러집니다. CAM은 <b>종류가 많으면서도 정답을 찾는 데 중요한 힌트가 되는</b> 텍스트를 다룹니다.</p>
</div>
<div class="cw g2">
  <div class="mb" style="font-size:11.8px; line-height:1.9"><span class="mu">원본</span>  상품코드 = "A123"  <span class="mu">(3,000종 중 하나)</span>

<span class="up">Frequency</span>  <span class="mu">인기 점수로 바꾸기</span>
  표 전체에서 몇 번 등장했는지를 셈
  A123 → <span class="up">5,000</span>   Z999 → <span class="up">10</span>
  <span class="mu">AI: "대중적인 상품을 산 사람과
       마니아틱한 상품을 산 사람의
       행동 패턴이 다르구나!"</span>

<span class="up">BTE</span>  <span class="mu">위험 확률 점수로 바꾸기</span>
  그 값을 가진 사람들의 정답 비율을 셈
  A123 → <span class="up">0.85</span>    Z999 → <span class="up">0.01</span>
  <span class="mu">AI: "0.85로 적힌 걸 보니
       이거 산 사람은 이탈할 확률이
       엄청 높은 위험한 부류구나!"</span></div>
  <div class="stack">
    <div class="qa">
      <div class="q">왜 '변환'이 아니라 '증강'이라고 부르나요?</div>
      <p class="an-a">기존 데이터를 억지로 묶거나 훼손하는 것이 아니라, <b>의미를 담은 새 컬럼을 만들어 원본 옆에 추가</b>하기 때문입니다.</p>
    </div>
    <div class="card sh"><span class="k">원래 설계에는 두 가지가 더 있었습니다</span>
      <ul class="li" style="margin-top:10px">
        <li><b>${a('binning','구간화 파생변수')}.</b> 나이 23, 27, 29를 20대로 묶으면 큰 틀에서 맥락을 짚어냅니다</li>
        <li><b>${a('combo','컬럼 조합')}.</b> 키와 몸무게로 <b>BMI</b>를 만들면 질병 예측이 훨씬 정확해집니다</li>
      </ul>
      <p class="tx sm mutetx" style="margin-top:10px">발동 조건은 "현재 컬럼만으로는 표현력이 부족해 성능이 안 나오는 경우"이고 <b>임계값은 미확인</b>입니다.</p></div>
    <div class="bn g">실측 <b>ML 11건, LLM 8건</b>(둘 다 오른 게 7건). 5개 정제 모듈 중 <b>양쪽 다 좋았던 것은 CAM 하나뿐</b>이라, 28장 쟁점 2에서 거의 유일하게 이견 없이 남는 후보입니다.</div>
  </div>
</div>`},

/* 20 ─ RAM */
{sec:'5장 · 전처리', title:'한쪽 비율이 높으면 그게 팩트 아닌가요', part:3, src:'5.1 댓글',
why:'왜 없는 데이터를 만들어내면서까지 비율을 맞추는지 봅니다.',
impact:'ML 성능은 가장 크게 올리는데 <b>점수는 깎이는</b> 모듈입니다.', html:`
<div class="hd cw">
  <span class="eb">5.1 RAM</span>
  <h2>한쪽 비율이 높으면 그게 팩트 아닌가요</h2>
</div>
<div class="cw g2">
  <div class="qa">
    <div class="q">현실에서 한쪽 비율이 높으면 그냥 그게 팩트 아닌가요?</div>
    <p class="an-a"><b>맞습니다.</b> 사기 결제가 0.1%라는 건 현실 통계입니다. 문제는 AI가 <b>점수를 잘 받는 꼼수</b>를 부린다는 점입니다.</p>
    <p class="an-a"><b>AI의 꼼수.</b> 이것이 ${a('imbal','클래스 불균형')}입니다. 10,000건 중 9,990건이 정상이고 10건이 사기면, AI는 사기범의 특징을 공부하지 않고 그냥 <b>"100% 다 정상입니다"라고 찍어버립니다.</b> 그래도 정답률이 99.9%니까요.</p>
    <p class="an-a"><b>우리의 목적.</b> 정답률 99.9%가 아니라 숨겨진 그 10건을 잡아내는 것입니다.</p>
    <p class="an-a"><b>해결책.</b> 꼼수를 못 쓰도록 <b>학습할 때만 임시로</b> ${a('cart','CART')}로 증강해 50:50으로 맞춥니다. <b>이후 실전 예측에서는 다시 원래 현실 비율로 작동합니다.</b></p>
  </div>
  <div class="stack">
    <div class="card ok"><span class="k g">실측 결과</span>
      <p class="tx sm" style="margin-top:2px">결함 16종 중 <b>14종에서 ${a('tree','트리 계열 ML')} 성능을 올렸습니다.</b> 5개 모듈 중 ML 기준 효과가 가장 큽니다. LLM 쪽은 3건입니다.</p></div>
    <div class="card bad"><span class="k r">그런데 대가가 있습니다</span><div class="h3 sm">원본의 노이즈도 함께 뻥튀기된다</div>
      <p class="tx sm">CART로 원본의 규칙을 정교하게 따라 만드는 것은 훌륭합니다. 하지만 원본 자체에 <b>잘못된 편향이나 노이즈가 숨어 있다면</b> 새로 만든 데이터도 <b>그 나쁜 패턴을 그대로 복제하며 뻥튀기</b>합니다.</p>
      <p class="tx sm">완벽한 만능키가 아니라 <b>약점이 존재하는 기술</b>입니다. 그 결과 ${a('dup','duplicate_ratio')}가 떨어지고 ${a('integ','Integrity')}가 깎입니다. 게다가 15장에서 봤듯 RAM은 <b>맨 마지막</b>이라 부작용을 정리할 단계도 없습니다. 계산은 24장입니다.</p></div>
  </div>
</div>`},

/* 21 ─ 6.1 */
{sec:'6장 · 점수', title:'축은 6개인데 왜 3개만 이야기하나', part:4, src:'6.1',
why:'6개 축이 같은 방식으로 계산되지 않는다는 것을 확인합니다.',
impact:'계산 방식의 차이가 곧 "전처리하면 움직이는가"의 차이입니다.', html:`
<div class="hd cw">
  <span class="eb">6.1 축의 구조</span>
  <h2>축은 6개인데 왜 3개만 이야기하나</h2>
  <p class="lead">이름은 나란히 붙어 있지만 이 6개는 <b>같은 방식으로 계산되지 않습니다.</b> 측정 방식에 따라 세 부류로 나뉩니다.</p>
</div>
<div class="cw">
  <table class="sm" style="margin-bottom:15px">
    <tr><th style="width:150px">축</th><th style="width:58px">한글</th><th>점수 산출 방식</th><th style="width:180px">전처리하면 움직이나</th></tr>
    <tr class="hi"><td class="lb">${a('integ','Integrity')}</td><td>정합성</td><td><b>데이터 내용</b>을 계산식으로 재서 0에서 1 사이 점수를 냄</td><td><b style="color:var(--red)">움직입니다</b> · RAM이 떨어뜨림</td></tr>
    <tr class="hi"><td class="lb">${a('consis','Consistency')}</td><td>일관성</td><td>같음</td><td><b style="color:var(--red)">움직입니다</b> · CSM이 엇갈리게 함</td></tr>
    <tr class="hi"><td class="lb">${a('ctx','Context')}</td><td>맥락</td><td>같음. 단 <b>재료 일부가 LLM 판단</b></td><td><b style="color:var(--grn)">움직입니다</b> · IPM이 확실히 올림</td></tr>
    <tr><td class="lb">${a('usab','Usability')}</td><td>유용성</td><td>개인정보 컬럼이 하나라도 있으면 <b>0</b>, 없으면 <b>1</b>. 중간이 없는 스위치</td><td>거의 안 움직입니다</td></tr>
    <tr><td class="lb">${a('reprod','Reproducibility')}</td><td>재현성</td><td><b>데이터 내용과 무관.</b> 플랫폼 기록을 체크리스트로 세어 커버리지 계산</td><td>안 움직입니다</td></tr>
    <tr><td class="lb">${a('trace','Traceability')}</td><td>추적성</td><td>같음</td><td>안 움직입니다</td></tr>
  </table>
  <div class="g2">
    <div class="card bad"><span class="k r">문제 5 · 두 축이 항상 100점입니다</span>
      <p class="tx sm" style="margin-top:2px">올리기만 하면 재현성과 추적성이 100%가 됩니다. 두 축은 데이터 품질이 아니라 <b>플랫폼이 이 확인들을 얼마나 수행하는가의 커버리지</b>이기 때문입니다. 추적성 7항목, 재현성 12항목의 O/X입니다.</p>
      <p class="tx sm mutetx">누가 언제 변경했는지 기록하는가(R5.1 WHO), 확정본으로 고정할 수 있는가(R6.1 · ${a('relstate','Release State')}), 두 확정본을 비교할 수 있는가(R6.4 DIFF)</p>
      <p class="quo">원본 정의 문서도 스스로 경고합니다. <b>"데이터셋별 품질 점수가 아니라 플랫폼이 이 확인들을 얼마나 수행하나의 커버리지로 읽을 것"</b></p></div>
    <div class="stack">
      <div class="card bad"><span class="k r">문제 6 · Usability에 중간이 없습니다</span>
        <p class="tx sm" style="margin-top:2px">원래는 위험 컬럼 수에 따라 깎는 계산식이었으나 지금은 이진입니다. 게이트 역할은 하지만 <b>개인정보 컬럼 1개와 30개를 같은 점수로</b> 취급합니다. 마스킹이 안 됐는데 완료로 표시되는 버그도 보고돼 있었습니다(TITAN-1192).</p></div>
      <div class="bn v">회의에서 나온 우려. <b>"타이탄에 올리니까 100점이니 이걸로 충족됐다고 얘기하는 데에 과연 설득력이 있을까."</b> 이 만점이 시작 점수를 밀어 올려 <b>29장 쟁점 6</b>으로 이어집니다.</div>
    </div>
  </div>
</div>`},

/* 22 ─ 6.2 8개 지표 */
{sec:'6장 · 점수', title:'각 지표는 움직이면 무슨 일이 생기나', part:4, src:'6.2',
why:'각 지표가 무엇을 세고 값이 움직이면 무엇이 따라 움직이는지 봅니다.',
impact:'맨 오른쪽 열이 <b>24~25장 사고의 예고편</b>입니다.', html:`
<div class="hd cw">
  <span class="eb">6.2 3축의 계산식</span>
  <h2>각 지표는 움직이면 무슨 일이 생기나</h2>
  <p class="lead">각 축은 하위 지표들의 <b>평균</b>입니다. Integrity는 두 지표를 각 0.5로, 나머지 둘은 세 지표를 각 3분의 1로. <b>절대량이 아니라 평균</b>이라 컬럼을 지우거나 늘리면 분모가 같이 바뀝니다.</p>
</div>
<div class="cw">
  <table class="sm">
    <tr><th style="width:250px">지표 · 계산식</th><th style="width:74px">축</th><th>값이 움직이면 무슨 일이 생기나</th></tr>
    <tr><td class="lb">${a('dup','duplicate_ratio')}<br><span class="mono mutetx">1 − 중복행수 ÷ 전체행수</span></td><td>Integrity</td><td>같은 행이 여러 번 있으면 AI가 그 패턴을 실제보다 중요하다고 착각합니다. <b style="color:var(--red)">RAM이 행을 늘리면 이 값이 떨어져 Integrity가 깎입니다</b></td></tr>
    <tr><td class="lb">${a('typec','type_consistency')}<br><span class="mono mutetx">(피처수 − 타입불일치수) ÷ 피처수</span></td><td>Integrity</td><td>숫자 컬럼에 글자가 섞이면 데이터가 손상된 것입니다. 전처리로 크게 움직이지는 않습니다</td></tr>
    <tr class="hi"><td class="lb">${a('frel','feature_relevance')}<br><span class="mono mutetx">(high+medium) ÷ 기여도 계산된 컬럼수</span></td><td>Consistency</td><td><b style="color:var(--grn)">순위 기반이라 CSM으로 컬럼을 지우면 남은 등수가 올라 이 값이 상승합니다</b></td></tr>
    <tr class="hi"><td class="lb">${a('redun','redundancy')}<br><span class="mono mutetx">1 − 컬럼 쌍별 상관 절댓값의 평균</span></td><td>Consistency</td><td>같은 정보인 컬럼이 많으면 AI가 그쪽에 치우칩니다. <b style="color:var(--red)">평균이라 상관 낮은 컬럼이 빠지면 이 값이 하락합니다</b></td></tr>
    <tr><td class="lb">${a('cardE','cardinality_efficiency')}<br><span class="mono mutetx">적정 범주형수 ÷ 전체 범주형수</span></td><td>Consistency</td><td>적정은 고유값 비율 0.01~0.30입니다. <b style="color:var(--grn)">CAM이 범주형을 수치형으로 바꾸면 분모가 줄어 이 값이 오를 수 있습니다</b></td></tr>
    <tr><td class="lb">${a('semc','semantic_coverage')}<br><span class="mono mutetx">설명 있는 피처수 ÷ 전체 피처수</span></td><td>Context</td><td>여기서 설명은 <b>LLM이 생성한 설명</b>이라, 컬럼명이 c1이면 설명을 못 붙여 값이 떨어집니다</td></tr>
    <tr><td class="lb">${a('goal','goal_alignment')}<br><span class="mono mutetx">(기여도 ≠ low) ÷ 평가된 컬럼수</span></td><td>Context</td><td>목적에 쓸모 있는 컬럼이 많을수록 좋다는 뜻입니다. 이것도 순위 기반이라 CSM과 함께 움직입니다</td></tr>
    <tr class="hi"><td class="lb">${a('insuf','input_sufficiency')}<br><span class="mono mutetx">LLM이 0~1로 채점 · 목적 미기재면 0.0</span></td><td>Context</td><td>"이탈을 예측하고 싶다"는데 데이터에 이탈 여부가 없으면 불가능한 요청이고 그걸 잡아냅니다. <b style="color:var(--grn)">IPM으로 목적을 받으면 0.0에서 바로 올라갑니다</b></td></tr>
  </table>
  <div class="bn v" style="margin-top:14px"><b>헷갈리기 쉬운 두 지표.</b> redundancy는 <b>열 중복도</b>(나이와 생년월일처럼 같은 정보인가), duplicate_ratio는 <b>행 중복도</b>(고객 한 줄이 완벽히 같은 기록인가)입니다. 하나는 세로, 하나는 가로입니다.</div>
</div>`},

/* 23 ─ 6.2 문제 7 */
{sec:'6장 · 점수', title:'열심히 고쳤는데 점수가 안 오릅니다', part:4, src:'6.2 문제 7',
why:'우리가 계산하는 지표가 8개가 전부는 아니라는 사실을 확인합니다.',
impact:'<b>발표자가 첫 번째 문제로 꼽은 항목</b>입니다.', html:`
<div class="hd cw">
  <span class="eb">6.2 · 문제 7</span>
  <h2>열심히 고쳤는데 점수가 안 오릅니다</h2>
  <p class="lead">아래 4개는 <span class="mono">trust_score</span>라는 별도 묶음에 속해서, 값은 계산되어 저장되지만 <b>6축 점수에는 반영되지 않습니다.</b></p>
</div>
<div class="cw g21" style="gap:20px">
  <table class="sm">
    <tr><th style="width:172px">미반영 지표</th><th>어느 모듈이 개선하며 왜 문제인가</th></tr>
    <tr class="hi"><td class="lb">${a('compl','completeness')}</td><td><b>${a('fnm','FNM')}.</b> FNM이 하는 일이 바로 빈칸 채우기인데 그 결과가 점수에 반영되지 않습니다</td></tr>
    <tr class="hi"><td class="lb">${a('dstab','distribution_stability')}</td><td><b>${a('ivm','IVM')}. 가장 문제가 되는 항목입니다.</b> IVM이 하는 일이 정확히 이걸 개선하는 건데 점수에 안 들어갑니다</td></tr>
    <tr><td class="lb">${a('labrel','label_reliability')}</td><td>대응 모듈 없음. 정답이 틀렸으면 나머지가 다 좋아도 의미가 없는데 점수에 없습니다</td></tr>
    <tr><td class="lb">${a('metai','metadata_integrity')}</td><td>진단 자체. 진단이 얼마나 잘 됐는지를 나타내는 지표인데 점수에 없습니다</td></tr>
  </table>
  <div class="stack">
    <div class="card bad"><span class="k r">그래서 무슨 일이 벌어지나</span>
      <p class="tx sm" style="margin-top:2px">IVM은 분포를 다듬고, 분포가 안정적인지 재는 지표도 우리가 이미 계산합니다. 그런데 점수에 안 들어갑니다. <b>IVM을 아무리 잘 실행해도 점수는 1점도 오르지 않습니다.</b> FNM도 마찬가지입니다.</p>
      <p class="tx sm">결과적으로 <b>5개 모듈 중 두 개는 점수를 올리는 데 직접 기여하지 않습니다.</b> 사용자는 열심히 개선했는데 화면의 숫자는 그대로입니다.</p></div>
    <div class="qa">
      <div class="q">그러면 왜 이 4개를 점수에 안 넣었나요?</div>
      <p class="an-a"><b>계보가 다른 지표</b>이기 때문입니다. <span class="mono">trust_score</span>는 "이 데이터를 에이전트에 넣어도 되는가"를 판정하는 <b>게이트</b> 용도로 설계되었습니다.</p>
      <p class="an-a"><b>넣으려던 흔적은 있습니다.</b> 2026-06-30 개선 과제에 "컬럼 중요도가 현재 산식에 미반영"이 <b>1순위 이슈</b>로 적혀 있었습니다. 그런데 <b>그 이슈가 완료 처리되었는데도 여전히 점수 밖입니다.</b> 어디까지 반영되었는지는 <b>AI팀 확인이 필요합니다.</b></p>
    </div>
  </div>
</div>`},

/* 24 ─ 7.1 */
{sec:'7장 · 어긋남', title:'제 할 일을 했는데 벌을 받습니다', part:5, src:'7.1 문제 8',
why:'시키는 대로 했는데 점수가 떨어지는 경우를 계산으로 확인합니다.',
impact:'성능이 가장 좋아지는 모듈을 <b>권하기 어려운 상태</b>가 됩니다.', html:`
<div class="hd cw">
  <span class="eb">7.1 · 문제 8</span>
  <h2>제 할 일을 했는데 벌을 받습니다</h2>
  <p class="lead">23장이 "개선했는데 점수가 안 오른다"였다면, 여기서부터는 <b>오히려 떨어지는</b> 경우입니다. 먼저 ${a('ram','RAM')}이 정합성을 깎는 경로입니다.</p>
</div>
<div class="cw g2">
  <div class="mb">[전처리 전]
전체 1000행 · 중복행 50행
정답 "예" 30건 / "아니오" 970건 <span class="mu">(심한 불균형)</span>
<span class="up">duplicate_ratio = 1 − 50/1000 = 0.95</span>  <span class="mu">좋은 편</span>

[RAM 실행] "예" 30건을 300건까지 채움
CART는 <span class="mu">원본의 패턴을 따라</span> 만드는 방식
원본 30건에 이미 중복이 섞여 있었다면
새로 만든 270건에도 <span class="dn">그 중복 패턴이 그대로</span>

[전처리 후]
전체 1270행 · 중복행 50 + 새로 생긴 다수
<span class="dn">duplicate_ratio 0.95 아래로 하락</span>
        ↓
<span class="dn">integrity_score 하락 → 총점 하락</span></div>
  <div class="stack">
    <div class="card bad"><span class="k r">증강은 성공했는데 점수는 깎입니다</span>
      <p class="tx sm" style="margin-top:2px">RAM은 실측에서 <b>16종 중 14종에서 ML 성능을 올린</b> 효자 모듈입니다. 그런데 그 대가로 중복행이 늘어 Integrity가 떨어집니다. <b>제품이 잘 작동해서 점수가 나빠지는 구조입니다.</b></p></div>
    <div class="card"><span class="k">더 근본적인 지적</span>
      <p class="tx sm" style="margin-top:2px">원본 자체가 중복이 불가피한 데이터라면 어떻게 하나. <b>수능 답안 데이터는 값이 1부터 5까지뿐이라 행이 겹치는 게 불가피합니다.</b> 데이터의 성질을 무시하고 중복률이라는 하나의 숫자만 보기 때문에 처음부터 낮게 나옵니다.</p></div>
    <div class="bn r">이상한 점이 하나 더 있습니다. <b>중복행을 점수에는 넣고 있는데, 중복을 제거하는 전처리는 없습니다.</b> 점수가 깎인 것을 보여주면서 고칠 도구는 주지 않는 셈입니다. 중복 제거를 추가하거나 중복률을 점수에서 빼거나, 둘 중 하나입니다.</div>
  </div>
</div>`},

/* 25 ─ 7.2 */
{sec:'7장 · 어긋남', title:'쓰레기를 버렸더니 남은 물이 탁해진다', part:5, src:'7.2 문제 9',
why:'컬럼을 지우면 점수를 예측할 수 없게 되는 산수를 따라갑니다.',
impact:'고객에게 결과를 미리 약속할 수 없다는 뜻이라 <b>안내 문구에 직결</b>됩니다.', html:`
<div class="hd cw">
  <span class="eb">7.2 · 문제 9</span>
  <h2>쓰레기를 버렸더니 남은 물이 탁해진다</h2>
  <p class="lead">${a('csm','CSM')}으로 컬럼을 지웠을 때 ${a('consis','Consistency')}가 깎이는, 산수의 함정입니다.</p>
</div>
<div class="cw g2">
  <div class="mb">[전처리 전] 컬럼 5개
상관 값들: 0.9, 0.8, 0.1, 0.1, 0.1, 0.1 …
<span class="mu">무관한 컬럼이 많아서</span> 상관 평균 = 0.3
<span class="up">redundancy = 1 − 0.3 = 0.7</span>

[CSM 실행] 기여도 낮은 컬럼 2개 제거
지워진 건 <span class="mu">대체로 다른 컬럼과 무관했던</span> 컬럼
즉 상관이 낮았던 0.1 쌍들이 <span class="dn">계산에서 빠짐</span>

[전처리 후] 컬럼 3개
남은 상관 값: 0.9, 0.8, 0.1 → 평균 = 0.6
<span class="dn">redundancy = 1 − 0.6 = 0.4  하락</span>
        ↓
<span class="dn">conciseness_score 하락 → 총점 하락</span></div>
  <div class="stack">
    <div class="card bad"><span class="k r">평균 계산의 딜레마</span>
      <p class="tx sm" style="margin-top:2px">쓰레기를 버렸으니 <b>총 중복량</b>은 분명히 줄었습니다. 하지만 시스템은 총량이 아니라 남은 컬럼들의 <b>밀도(평균)</b>를 봅니다. 핵심만 남았으니 평균 상관도는 자연스럽게 오르고, 시스템은 이를 "중복이 심해졌다"고 오해합니다.</p>
      <p class="tx sm">정리하면 <b>데이터를 깨끗하게 정제한다 = 평균 상관도가 오른다 = 시스템이 점수를 깎는다.</b> 컬럼을 지우는 어떤 전처리도 이 함정을 피할 수 없습니다.</p></div>
    <div class="ex"><span class="exk">작은 데이터의 비극</span>
      <p>100명 중 2명이 같은 주장을 하면 2%지만, <b>3명 중 2명이 같은 주장을 하면 66% 중복</b>입니다. 컬럼이 3~4개뿐인 작은 데이터는 조금만 연관성이 있어도 평균 상관도가 폭발적으로 치솟습니다. <b>아무리 정제를 잘해도 무조건 낮은 점수를 받을 수밖에 없는 불공평한 구조</b>이고, 실무진도 이를 인정하고 있습니다.</p></div>
    <div class="bn r"><b>버튼 하나에 세 갈래가 동시에.</b> ${a('redun','redundancy')} 하락, ${a('frel','feature_relevance')} 상승, ${a('goal','goal_alignment')} 상승. 총점이 오를지 내릴지는 데이터에 따라 다르고 <b>예측이 안 됩니다.</b></div>
  </div>
</div>`},

/* 26 ─ 8장 */
{sec:'8장 · 요약', title:'한 장으로 보는 어긋남의 지도', part:5, src:'8장',
why:'문제 열 개를 모듈에서 총점까지 한 장에 펼쳐 봅니다.',
impact:'<b>회의에서 이 장만 있으면 대화를 따라갈 수 있습니다.</b>', html:`
<div class="hd cw">
  <span class="eb">8. 한 장 요약</span>
  <h2>한 장으로 보는 어긋남의 지도</h2>
</div>
<div class="cw g21" style="gap:20px">
  <div class="mb" style="font-size:11.2px; line-height:1.78">전처리 모듈 ─→ 개선되는 지표 ─→ 어느 축 ─→ 총점

<span class="mu">FNM</span> 빈칸 처리 ─→ completeness         ─→ <span class="dn">(없음)</span> ─→ 변화 없음
<span class="mu">IVM</span> 값 다듬기 ─→ distribution_stability ─→ <span class="dn">(없음)</span> ─→ 변화 없음
              <span class="dn">↑ 이 두 개가 점수 밖에 있는 게 문제 7</span>

<span class="mu">CSM</span> 컬럼 제거 ┬→ redundancy 하락      ─→ Consist. ─→ <span class="dn">하락</span>
              ├→ feature_relevance ↑  ─→ Consist. ─→ <span class="up">상승</span>
              └→ goal_alignment ↑     ─→ Context  ─→ <span class="up">상승</span>
              <span class="dn">↑ 세 방향이 엇갈려 총합 예측 불가</span>

<span class="mu">CAM</span> 숫자화   ─→ cardinality_efficiency ─→ Consist. ─→ <span class="up">상승 가능</span>

<span class="mu">RAM</span> 행 증강  ─→ duplicate_ratio 하락  ─→ Integrity ─→ <span class="dn">하락</span>
              <span class="dn">↑ 성능은 가장 좋은데 점수는 깎임</span>

<span class="mu">IPM</span> 되묻기   ┬→ input_sufficiency ↑  ─→ Context  ─→ <span class="up">상승</span>
              └→ semantic_coverage ↑  ─→ Context  ─→ <span class="up">상승</span>
              <span class="up">↑ 유일하게 확실히 오르는 경로</span></div>
  <div class="stack">
    <div class="card hl"><span class="k v">이 표에서 읽어야 할 결론</span>
      <p class="tx" style="margin-top:2px">데이터를 수학적으로 다듬는 전처리는 점수에 악영향을 주거나 아예 미반영되고, 데이터에 <b>설명을 달아주는 ${a('ipm','IPM')}만이 점수를 확실히 올립니다.</b> 그런데 IPM은 <b>데이터 값을 한 칸도 안 바꿉니다.</b></p>
      <p class="tx">이 지점에서 회의의 성격이 바뀌었습니다. "산식을 어떻게 고칠까"에서 <b>"AI-ready라는 건 데이터를 고치는 게 아니라 맥락을 붙이는 일이 아닌가"</b>로요.</p></div>
    <div class="card bad"><span class="k r">그런데 IPM은 화면에 연결되어 있지 않습니다</span>
      <p class="tx sm" style="margin-top:2px">다른 전처리는 "전처리 시작"을 누르면 실행되는데 IPM은 그렇지 않습니다. 연결하려면 프론트엔드를 바꿔야 하고 규모가 큽니다.</p>
      <p class="tx sm">바꿔도 문제가 남습니다. 사용자 눈에는 <b>데이터를 하나도 안 고쳤는데 점수가 오르는</b> 것으로 보입니다. <b>이걸 어떻게 설명할지가 기획 과제로 남아 있습니다.</b></p></div>
  </div>
</div>`},

/* 27 ─ 9장 */
{sec:'9장 · Proof Run', title:'점수 말고 실제 성능을 재자', part:6, src:'9장',
why:'기능은 정리되어 있는데 회의에서 존폐부터 다시 논의된 이유를 봅니다.',
impact:'어디에 붙이느냐에 따라 <b>신뢰의 위기로 번질 수 있습니다.</b>', html:`
<div class="hd cw">
  <span class="eb">9. Proof Run</span>
  <h2>점수 말고 실제 성능을 재자</h2>
  <p class="lead">원래 전제는 <b>"결함을 고치면 → 점수가 오르고 → 실제 AI 성능도 좋아진다"</b>였습니다. 검증 실험에서 이 전제가 깨졌습니다. 필요한 것만 골라 적용한 쪽이 더 좋았고, 일부는 오히려 성능을 떨어뜨렸습니다.</p>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="card"><span class="k">${a('proofrun','Proof Run')}은 어떤 기능인가</span>
      <p class="tx sm" style="margin-top:2px">원본을 학습용과 검증용으로 나눠 모델을 만들고 채점한 것이 Before, 전처리한 데이터로 같은 과정을 반복한 것이 After입니다. <b>같은 모델, 같은 채점 기준, 같은 분할, 같은 랜덤 시드</b>를 씁니다. 1차는 <b>이진 분류만</b> 지원하고, ${a('proofkit','Proof Kit')}으로 데이터와 실행 코드를 묶어 내려받게 할 계획입니다.</p>
      <p class="quo">PRD에 이렇게 적혀 있습니다. <b>"모델 성능 전처리로 AI-Ready Score는 낮아질 수 있음을 함께 안내함"</b></p></div>
    <div class="qa">
      <div class="q">전처리를 하면 성능이 오르는 거 맞나요, 아닌가요?</div>
      <p class="an-a"><b>무엇을 위해 오르는지를 빼면 대답할 수 없는 질문</b>입니다. 결함 16종 실측입니다.</p>
      <p class="an-a"><b>RAM</b> ML 14 / LLM 3 · <b>IVM</b> ML 0 / LLM 9 · <b>CAM</b> ML 11 / LLM 8 · <b>CSM</b> ML 2 / LLM 3 · <b>FNM</b> ML 1 / LLM 4</p>
      <p class="an-a">다섯 줄을 나란히 보면 <b>ML에 좋은 전처리와 LLM에 좋은 전처리가 다르다</b>는 게 보입니다. 29장 쟁점 5가 포지셔닝 질문이 아니라 <b>기술 질문</b>이 되는 이유입니다.</p>
    </div>
  </div>
  <div class="card bad"><span class="k r">회의에서 제기된 세 가지</span>
    <p class="tx sm" style="margin-top:2px"><b>A. 존재 이유가 사라졌다.</b> 만들어진 이유는 "점수와 ML 성능이 상관관계를 안 보인다"였는데, 이후 <b>"두 지표는 상관관계가 없어도 된다"</b>로 정리됐습니다. 그러면 기능도 같이 사라져야 하는 것 아니냐는 지적입니다.</p>
    <p class="tx sm"><b>B. 진단 탭에 붙어 있으면 리스크다.</b> 고객은 "우리 전처리가 성능을 올린다"는 약속으로 읽는데, 돌려봤는데 안 오르면 신뢰의 위기로 번집니다.</p>
    <p class="quo"><b>"이거 해서 잘 안 되면 그냥 우리 전처리 AI 레디 스코어 그냥 거짓말 아니야, 그런 식으로밖에 안 보일 것"</b></p>
    <p class="tx sm"><b>C. 사람이 개입하면 검증이 아니다.</b> 사용자가 이진 분류를 3분류로 바꾸는 순간 성능 숫자가 완전히 달라집니다. 사람의 선택이 결과를 좌우하면 제품의 성능 증명이 아닙니다.</p>
    <p class="tx sm">B와 C의 대안은 같습니다. Proof Run을 진단이 아니라 <b>에이전트 실행 쪽</b>으로 옮기는 것입니다. "데이터를 이만큼 정리했더니 에이전트가 알아서 더 좋은 모델을 만들어냈다"는 형태라면 가치가 있다는 의견입니다.</p></div>
</div>`},

/* 28 ─ 10장 쟁점 1~3 */
{sec:'10장 · 쟁점', title:'그렇다면 어떤 처리가 필요한가', part:7, src:'10장',
why:'논의 전체를 관통하는 인식 전환과 가장 무게가 실린 세 쟁점입니다.',
impact:'쟁점 3이 <b>회의에서 가장 많은 동의</b>를 받은 방향입니다.', html:`
<div class="hd cw">
  <span class="eb">10. 패러다임의 전환</span>
  <h2>그렇다면 어떤 처리 과정이 필요한 걸까요</h2>
  <p class="lead">기존 방식이 수천 개의 약물 이름을 등장 횟수로 접어버렸다면, LLM은 "아세트아미노펜은 해열진통제다"라는 <b>표 밖의 지식</b>을 가져와 '진통제인가 아닌가'라는 새 축을 추가합니다. 데이터를 고치지 않아도 <b>의미를 설명해 주는 것만으로 성능이 일관되게 오릅니다.</b></p>
</div>
<div class="cw g3" style="gap:14px">
  <div class="card sh"><span class="k">쟁점 1 · 점수를 무엇으로 볼 것인가</span>
    <p class="tx sm" style="margin-top:2px"><b>A. 데이터 상태 그대로.</b> 같은 데이터는 항상 같은 점수. 단순하지만 개선한 것이 안 나타납니다.</p>
    <p class="tx sm"><b>B. 전처리 전후 차이.</b> 한 일이 반영되지만 나중에 새로 올리면 점수가 달라져 일관성이 깨집니다.</p>
    <p class="tx sm"><b style="color:var(--v-dp)">C. 진단 자체를 가치로.</b> 전처리를 안 해도 불확실성을 해소한 것만으로 점수가 오릅니다. <b>가장 오래 논의된 방향</b>입니다.</p>
    <div class="ex" style="margin-top:11px"><span class="exk">C안이 무슨 말인가</span>
      <p>결측치가 많으면 상식적으로 나쁜 데이터입니다. 그런데 물어봤더니 <b>"그 빈칸은 누락이 아니라 해당 없음"</b>이라는 답이 왔습니다. 그러면 원래부터 괜찮은 데이터였던 겁니다. 데이터는 한 칸도 안 바뀌었는데 <b>불확실성이 사라졌습니다.</b> 회의에서는 슈뢰딩거의 고양이에 비유했습니다.</p></div></div>
  <div class="card sh"><span class="k">쟁점 2 · ${a('gener','범용 전처리')}로 좁힐 것인가</span>
    <p class="tx sm" style="margin-top:2px">해도 대부분 좋아지는 것만 남기자는 발상입니다. 출발점은 문제 3과 문제 4입니다.</p>
    <p class="quo"><b>"그러려다 보면은 범용 전처리라는 게 거의 없어지긴 해요"</b></p>
    <p class="tx sm"><b>변별력 문제.</b> 우리 고객사는 공공기관이 많고 대체로 깨끗한 데이터가 들어옵니다. 범용만 남기면 손댈 게 없어 개선을 보여줄 게 없어집니다.</p>
    <p class="tx sm"><b>반론.</b> 손댈 게 없다면 애초에 AI-ready된 데이터입니다. 점수가 높은 게 맞고 그 이유를 설명할 수 있으면 충분합니다.</p></div>
  <div class="card hl"><span class="k v">쟁점 3 · ${a('ctx','Context')} 비중 · 가장 많은 동의</span>
    <p class="tx sm" style="margin-top:2px">컬럼 정보가 없는 것과 제대로 박혀 있는 것은 <b>에이전트가 받는 정보량이 완전히 다릅니다.</b> 중요한 건 분포가 아니라 이 데이터가 무엇을 목적으로 어떻게 얻어졌는지를 알 수 있는 상태인가입니다.</p>
    <p class="tx sm">맞춤법이 틀린 문장도 LLM은 잘 읽습니다. 그러면 이미 AI-ready입니다. <b>그런데 우리는 맞춤법을 다 고치려 하고 있습니다.</b></p>
    <div class="ex" style="margin-top:11px"><span class="exk">걸린 리스크 두 개</span>
      <p><b>하나.</b> Context는 LLM 판단에 의존합니다(문제 1). 비중을 키우면 <b>재현성 보장이 더 어려워집니다.</b></p>
      <p><b>둘.</b> 이미 결정한 것을 되돌리는 일입니다. 오랜 논쟁 끝에 태스크와 점수를 분리했는데 다시 붙습니다. <b>"거의 처음부터 다시 설계가 들어가야 돼서 리스크가 커 보인다"</b></p></div></div>
</div>`},

/* 29 ─ 10장 쟁점 4~6 */
{sec:'10장 · 쟁점', title:'쟁점 4~6, 그리고 남은 확인', part:7, src:'10장 · 12장',
why:'나머지 세 쟁점과 이 문서가 미확인으로 남긴 것을 정리합니다.',
impact:'네 항목 모두 <b>AI팀 또는 개발팀 확인이 필요합니다.</b>', html:`
<div class="hd cw">
  <span class="eb">10. 미결 쟁점 · 12. 남은 확인</span>
  <h2>쟁점 4~6, 그리고 남은 확인</h2>
</div>
<div class="cw">
  <div class="g3" style="gap:14px; margin-bottom:15px">
    <div class="card sh"><span class="k">쟁점 4 · ${a('ipm','IPM')}을 어디에 둘 것인가</span>
      <p class="tx sm" style="margin-top:2px"><b>전처리의 한 종류로.</b> 약국의 약이 전처리라면 환자가 운동하고 습관을 고치는 게 IPM이라는 관점입니다. 현재 방향이고 UI 작업이 필요합니다.</p>
      <p class="tx sm"><b>진단 뒤 별도 단계로.</b> 진단을 끝내고 부족한 정보만 물은 뒤 다시 진단합니다. 진단이 두 번 돌고 점수도 두 번 나옵니다.</p>
      <p class="tx sm"><b>상시 컨텍스트 관리 기능으로.</b> 언제든 수정하는 데이터 설명서 역할입니다. 이미 중장기 방향으로 정리된 안이고 2차 후속 범위입니다.</p></div>
    <div class="card sh"><span class="k">쟁점 5 · 우리 제품은 누구를 위한 것인가</span>
      <p class="tx sm" style="margin-top:2px">가장 오래된 쟁점인데 이번에는 성격이 달라졌습니다. <b>ML에 좋은 모듈과 LLM에 좋은 모듈이 다르다는 게 실측으로 확인되면서, 포지셔닝 질문이 아니라 어느 모듈을 남길지의 문제가 되었기 때문입니다.</b></p>
      <p class="tx sm">갈리는 지점은 넷입니다. ML 모델용인가 에이전트용인가, 타겟이 엔지니어인가 데이터를 모르는 사람인가, 핵심이 진단기인가 시뮬레이터인가, 기존 업무에 붙는가 없던 업무를 설계하는가.</p>
      <p class="tx sm mutetx">차별점의 근거가 결국 ${a('dts','DTS')}에 있다는 의견도 나왔습니다. 다만 경쟁사도 비슷한 것을 한다는 반론이 있었습니다.</p></div>
    <div class="card sh"><span class="k">쟁점 6 · 점수가 몇 점으로 나오는 게 맞나</span>
      <p class="tx sm" style="margin-top:2px">출발점은 문제 5입니다. ${a('reprod','재현성')}과 ${a('trace','추적성')}이 늘 100점이라 시작 점수가 높고 개선 폭이 작아 보입니다.</p>
      <p class="tx sm">한쪽은 우리 기준에서 높으면 그게 AI-ready라는 반증이니 괜찮다는 관점, 다른 쪽은 개선 폭을 보여주려면 시작이 낮아야 한다는 관점입니다. 후자라면 올리기만 하면 충족되는 영역을 <b>업로드 전 원본 기준으로 계산</b>해 두 축을 낮출 수 있습니다.</p>
      <p class="tx sm"><b>실제 개선 폭은 보통 4~5%</b>이고 10%를 넘기기 어렵습니다. 왜 그만큼인지 <b>설명할 화면이 지금 없습니다.</b></p></div>
  </div>
  <div class="g2">
    <div class="card hl"><span class="k v">가장 유력한 방향</span><div class="h3 sm">맞춤법 교정기에서 의미 번역기로</div>
      <p class="tx sm">Integrity와 Consistency의 비중을 낮추고 Context 축의 비중을 키우는 구조가 심도 있게 논의되었습니다. 10장에서 본 <b>"컬럼 이름만 바꿔도 점수가 달라진다"</b>도 이 관점에서는 버그가 아니라, 성능이 실제로 달라지는 것을 점수가 반영한 결과가 됩니다.</p></div>
    <div class="card bad"><span class="k r">이 문서에서 미확인으로 남은 것</span>
      <ul class="li" style="margin-top:9px">
        <li>${a('csm','CSM')}, ${a('cam','CAM')}, ${a('ram','RAM')}의 구체적 판정 임계값</li>
        <li>10번·11번 노드가 정확히 어디까지 미사용인지</li>
        <li>${a('trust','trust_score')} 4지표를 6축에 반영하는 작업이 어디까지 진행되었는지</li>
        <li>${a('usab','Usability')}, ${a('reprod','Reproducibility')}, ${a('trace','Traceability')} 세 축이 화면에 실제로 어떤 값으로 표시되는지</li>
      </ul></div>
  </div>
</div>`}

];

/* ═══════════════════════════════════════════════════════════
   렌더링 · 진행 막대 · 좌표 카드 · 목차 · 주석
   ═══════════════════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const W = 1440, H = 810;
let idx = 0, k = 1;

/* 파트별 슬라이드 범위를 미리 센다 */
const pIdx = PARTS.map(() => []);
SLIDES.forEach((s, i) => { if (s.part >= 0) pIdx[s.part].push(i); });

/* 한 슬라이드의 진행 막대 HTML */
function progressBar(i){
  const p = SLIDES[i].part;
  if (p < 0) return PARTS.map(part =>
    `<span class="pseg" style="flex:1 0 0; --p:0%"><i></i><em>${part.lab}</em></span>`).join('');
  return PARTS.map((part, n) => {
    const list = pIdx[n];
    let cls = '', fill = '0%';
    if (n < p){ cls = ' done'; }
    else if (n === p){ cls = ' cur'; fill = ((list.indexOf(i) + 1) / list.length * 100) + '%'; }
    return `<span class="pseg${cls}" style="flex:${list.length} 0 0; --p:${fill}">`
         + `<i></i><em>${n + 1}. ${part.lab}</em></span>`;
  }).join('');
}

/* 오른쪽 좌표 카드 HTML */
function orientCard(i){
  const s = SLIDES[i];
  if (s.part < 0){
    return `<div class="oc">
      <span class="ocp">들어가기 전에</span>
      <div class="oct">${s.title}</div>
      <div class="ocr"></div>
      <div class="ocb"><span class="ocl">왜 필요한가</span><p>${s.why || ''}</p></div>
      <div class="ocb"><span class="ocl">어디에 영향</span><p>${s.impact || ''}</p></div>
      <div class="ochint">점선 단어를 클릭하면 이 자리에 설명이 붙습니다</div>
    </div>`;
  }
  const part = PARTS[s.part];
  const list = pIdx[s.part];
  const pos = list.indexOf(i) + 1;
  return `<div class="oc">
    <span class="ocp">Part ${s.part + 1} / ${PARTS.length} · ${part.t}</span>
    <div class="oct">${s.title}</div>
    <div class="ocr"></div>
    <div class="ocb"><span class="ocl">왜 필요한가</span><p>${s.why || ''}</p></div>
    <div class="ocb"><span class="ocl">어디에 영향</span><p>${s.impact || ''}</p></div>
    <div class="ochint">원문 ${s.src || '-'} · 이 파트 ${pos}/${list.length}장<br>점선 단어를 클릭하면 이 자리에 설명이 붙습니다</div>
  </div>`;
}

SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 's' + (s.dark ? ' dk' : '');
  el.dataset.i = i;
  el.innerHTML = s.html;

  // 제목(.hd)만 남기고 나머지 본문 블록을 .bd > .fit 안으로 옮긴다
  const hd = el.querySelector(':scope > .hd');
  const bd = document.createElement('div');
  bd.className = 'bd';
  const ft = document.createElement('div');
  ft.className = 'fit';
  [...el.children].forEach(c => { if (c !== hd) ft.appendChild(c); });
  bd.appendChild(ft);
  el.appendChild(bd);

  // 전환 페이지는 전체 폭을 쓰므로 주석 여백을 두지 않는다
  if (!s.cover && !s.divider){
    el.insertAdjacentHTML('beforeend',
      `<div class="rail">${orientCard(i)}</div><svg class="wires"></svg>`);
  }
  if (!s.cover){
    el.insertAdjacentHTML('beforeend',
      `<div class="foot"><div class="pb">${progressBar(i)}</div>
         <span class="pnum">${String(i+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}</span></div>`);
  }
  deck.appendChild(el);
});

const slides = [...deck.querySelectorAll('.s')];
document.getElementById('tot').textContent = SLIDES.length;

/* ── 넘침 방지 ──
   본문이 슬라이드 높이를 넘으면 그 슬라이드만 통째로 축소한다.
   offsetHeight/clientHeight는 레이아웃 값이라 바깥 transform 영향을 받지 않는다. */
function autofit(el){
  const bd = el.querySelector(':scope > .bd');
  const ft = bd && bd.querySelector(':scope > .fit');
  if (!ft) return;
  // 먼저 원래 크기로 되돌려 자연 높이를 잰다
  ft.style.transform = '';
  ft.style.height = '';
  const avail = bd.clientHeight, need = ft.offsetHeight;
  if (!avail || !need) return;
  if (need > avail + 1){
    const r = Math.max(0.70, avail / need);
    ft.style.transform = `scale(${r})`;
    ft.style.height = Math.ceil(need * r) + 'px';   // 축소된 만큼만 자리를 차지하게
  }
}
function autofitAll(){ slides.forEach(autofit); }

/* ── 뷰포트 맞춤 ── */
function fit(){
  const pad = 60;
  k = Math.min((innerWidth - pad) / W, (innerHeight - pad) / H);
  deck.style.transform = `scale(${k})`;
}
addEventListener('resize', () => { fit(); relayout(); });
new ResizeObserver(() => { fit(); relayout(); }).observe(document.documentElement);
fit();
autofitAll();
// 폰트가 늦게 오면 줄바꿈이 달라지므로 다시 잰다
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { autofitAll(); relayout(); });
addEventListener('load', () => { autofitAll(); relayout(); });

/* ── 슬라이드 이동 ── */
function go(n){
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (n === idx) return;
  closeAll(slides[idx]);
  slides[idx].classList.remove('on');
  idx = n;
  slides[idx].classList.add('on');
  sync();
}
function sync(){
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('bar').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  document.getElementById('bprev').disabled = idx === 0;
  document.getElementById('bnext').disabled = idx === SLIDES.length - 1;
  [...document.querySelectorAll('#ovl a')].forEach(a =>
    a.classList.toggle('cur', +a.dataset.i === idx));
}
slides[0].classList.add('on');
sync();

setTimeout(() => document.getElementById('help').classList.add('gone'), 8000);

document.getElementById('bprev').onclick = () => go(idx - 1);
document.getElementById('bnext').onclick = () => go(idx + 1);

addEventListener('keydown', e => {
  const ov = document.getElementById('ov');
  if (e.key === 'Escape'){
    if (ov.classList.contains('on')) { ov.classList.remove('on'); return; }
    closeAll(slides[idx]); return;
  }
  if (e.key === 'o' || e.key === 'O' || e.key === 'ㅐ'){ ov.classList.toggle('on'); return; }
  if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
    return;
  }
  if (e.key === '?'){ document.getElementById('help').classList.remove('gone'); return; }
  if (ov.classList.contains('on')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(idx + 1); }
  if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(idx - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(SLIDES.length - 1);
});

/* ── 목차 · 파트별로 묶어서 보여준다 ── */
const ovl = document.getElementById('ovl');
function tocLink(i){
  const a = document.createElement('a');
  a.dataset.i = i;
  a.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${SLIDES[i].title}</span>`;
  a.onclick = () => { go(i); document.getElementById('ov').classList.remove('on'); };
  return a;
}
{
  const cover = document.createElement('div');
  cover.className = 'grp';
  cover.innerHTML = `<div class="gh"><span class="gn">00</span><span class="gt">표지</span></div>`;
  const cl = document.createElement('div'); cl.className = 'gl';
  SLIDES.forEach((s, i) => { if (s.part < 0) cl.appendChild(tocLink(i)); });
  cover.appendChild(cl); ovl.appendChild(cover);
}
PARTS.forEach((part, n) => {
  const list = pIdx[n];
  if (!list.length) return;
  const g = document.createElement('div');
  g.className = 'grp';
  g.innerHTML = `<div class="gh"><span class="gn">Part ${n+1}</span><span class="gt">${part.t}</span>`
    + `<span class="gw">${String(list[0]+1).padStart(2,'0')}–${String(list[list.length-1]+1).padStart(2,'0')} · ${list.length}장</span></div>`;
  const gl = document.createElement('div'); gl.className = 'gl';
  list.forEach(i => gl.appendChild(tocLink(i)));
  g.appendChild(gl);
  ovl.appendChild(g);
});
document.getElementById('btoc').onclick = () => document.getElementById('ov').classList.toggle('on');

/* ── 주석 ── */
function closeAll(slide){
  slide.querySelectorAll('.note').forEach(n => n.remove());
  slide.querySelectorAll('.an.act').forEach(t => t.classList.remove('act'));
  const sv = slide.querySelector('svg.wires'); if (sv) sv.innerHTML = '';
  const r = slide.querySelector('.rail'); if (r) r.classList.remove('busy');
}

deck.addEventListener('click', e => {
  const term = e.target.closest('.an');
  if (!term) return;
  const slide = term.closest('.s');
  if (!slide.querySelector('.rail')) return;
  const key = term.dataset.n;
  if (!N[key]) return;

  // 같은 단어를 다시 누르면 닫는다
  const mine = slide.querySelector(`.note[data-for="${termId(term)}"]`);
  if (mine){ dropNote(mine); relayout(); return; }
  // 같은 용어가 다른 자리에서 열려 있으면 그쪽을 닫고 여기로 옮긴다
  const dup = slide.querySelector(`.note[data-n="${key}"]`);
  if (dup) dropNote(dup);

  term.classList.add('act');
  const [kind, title, ...body] = N[key];
  const note = document.createElement('div');
  note.className = 'note in';
  note.dataset.n = key;
  note.dataset.for = termId(term);
  note.dataset.seq = ++seq;
  note.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <span class="nk">${kind}</span>
    <div class="nt">${title}</div>
    ${body.map(b => `<p class="nb">${b}</p>`).join('')}`;
  note.querySelector('.x').onclick = ev => {
    ev.stopPropagation(); dropNote(note); relayout();
  };
  slide.querySelector('.rail').appendChild(note);
  relayout();
});

let seq = 0;
function dropNote(note){
  const t = document.querySelector(`.an[data-tid="${note.dataset.for}"]`);
  if (t) t.classList.remove('act');
  note.remove();
}

let tid = 0;
function termId(el){
  if (!el.dataset.tid) el.dataset.tid = 't' + (++tid);
  return el.dataset.tid;
}

/* 주석 카드 위치 계산 + 연결선 */
function relayout(){
  const slide = slides[idx];
  const rail = slide.querySelector('.rail');
  const svg = slide.querySelector('svg.wires');
  if (!rail || !svg) return;

  svg.innerHTML = '';
  const sr = slide.getBoundingClientRect();
  const rr = rail.getBoundingClientRect();
  const railTop = (rr.top - sr.top) / k;
  const railH = rr.height / k;
  const railX = (rr.left - sr.left) / k;

  // 여백에 담을 수 있는 양을 넘으면 먼저 연 카드부터 자동으로 닫는다
  let notes = [...rail.querySelectorAll('.note')];
  const hOf = n => n.getBoundingClientRect().height / k;
  while (notes.length > 1 &&
         notes.reduce((a, n) => a + hOf(n), 0) + 11 * (notes.length - 1) > railH){
    dropNote(notes.reduce((a, b) => (+a.dataset.seq < +b.dataset.seq ? a : b)));
    notes = [...rail.querySelectorAll('.note')];
  }
  rail.classList.toggle('busy', notes.length > 0);
  if (!notes.length) return;

  const items = notes.map(n => {
    const t = slide.querySelector(`.an[data-tid="${n.dataset.for}"]`);
    const tr = t.getBoundingClientRect();
    return {
      note: n, term: t,
      tx: (tr.right - sr.left) / k,
      ty: (tr.top - sr.top) / k + (tr.height / k) / 2,
      want: (tr.top - sr.top) / k - railTop - 4,
      h: n.getBoundingClientRect().height / k
    };
  }).sort((a, b) => a.want - b.want);

  // 아래로 밀어 충돌 해소
  let cur = 0;
  items.forEach(it => {
    it.top = Math.max(it.want, cur);
    cur = it.top + it.h + 11;
  });
  // 넘치면 위로 되밀기
  const over = cur - 11 - railH;
  if (over > 0){
    let bound = railH;
    for (let i = items.length - 1; i >= 0; i--){
      items[i].top = Math.min(items[i].top, bound - items[i].h);
      bound = items[i].top - 11;
    }
    items.forEach(it => it.top = Math.max(0, it.top));
  }

  const ns = 'http://www.w3.org/2000/svg';
  items.forEach(it => {
    it.note.style.top = it.top + 'px';
    const x1 = it.tx + 3, y1 = it.ty;
    const x2 = railX - 2, y2 = it.top + railTop + 18;
    const mid = x1 + (x2 - x1) * 0.55;
    const d = `M${x1} ${y1} C${mid} ${y1}, ${x1 + (x2-x1)*0.45} ${y2}, ${x2} ${y2}`;

    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
    p.style.setProperty('--L', p.getTotalLength());

    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x1); c.setAttribute('cy', y1); c.setAttribute('r', 2.6);
    svg.appendChild(c);
  });
}
</script>
