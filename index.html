<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Syntitan AI-ready Score 완벽 해설</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  color-scheme: only light;

  /* 종이와 잉크 */
  --paper:#FCFAF6; --paper2:#F5F1E9; --white:#FFFFFF;
  --ink:#191713;
  --t-title:#191713;
  --t-strong:rgba(25,23,19,.90);
  --t-body:rgba(25,23,19,.74);
  --t-mute:rgba(25,23,19,.56);
  --t-faint:rgba(25,23,19,.36);

  /* 강조색 */
  --v:#5B49D8; --v-lt:#8477EC; --v-dp:#4335B4;
  --v-05:rgba(91,73,216,.05);
  --v-09:rgba(91,73,216,.09);
  --v-16:rgba(91,73,216,.16);
  --red:#C42B52; --red-06:rgba(196,43,82,.06); --red-24:rgba(196,43,82,.24);
  --grn:#0D7A4E; --grn-06:rgba(13,122,78,.06); --grn-24:rgba(13,122,78,.24);
  --amb:#A85B10; --amb-06:rgba(168,91,16,.07);

  --line:rgba(25,23,19,.11);
  --hair:rgba(25,23,19,.065);

  /* 밤 슬라이드 */
  --night:#17161D; --night2:#1F1E27;
  --nt:#FBF9F4; --nt-body:rgba(251,249,244,.72); --nt-mute:rgba(251,249,244,.50);
  --nt-line:rgba(251,249,244,.14);
  --nt-v:#B6A9FF;

  --f:'Pretendard Variable',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --m:'JetBrains Mono','Courier New',monospace;
  --W:1440px; --H:810px; --RAIL:266px; --PAD:64px; --GAP:34px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#E9E5DC; color:var(--t-body); font-family:var(--f);
  letter-spacing:-.014em; word-break:keep-all; overflow:hidden;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}
b,strong{font-weight:700;color:var(--t-strong)}
em{font-style:normal}

/* ══════════ 무대 ══════════ */
#stage{position:fixed; inset:0; display:grid; place-items:center}
#deck{width:var(--W); height:var(--H); position:relative; transform-origin:center center;
  background:var(--paper); border-radius:4px;
  box-shadow:0 24px 70px rgba(25,23,19,.18), 0 0 0 1px rgba(25,23,19,.07)}

/* ══════════ 슬라이드 ══════════ */
.s{position:absolute; inset:0; padding:58px var(--PAD) 66px; background:var(--paper);
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity .24s ease;
  display:flex; flex-direction:column; border-radius:4px}
.s.on{opacity:1; visibility:visible; pointer-events:auto}
.hd{flex:0 0 auto; margin-bottom:26px}
.bd{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center}
/* 주석이 앉을 오른쪽 여백은 모든 슬라이드에서 늘 비워 둔다 */
.cw{width:calc(var(--W) - var(--PAD)*2 - var(--RAIL) - var(--GAP))}

/* 밤 슬라이드 */
.s.dk{background:var(--night); color:var(--nt-body)}
.s.dk b,.s.dk strong,.s.dk h1,.s.dk h2,.s.dk .h3{color:var(--nt)}

/* ── 머리말 ── */
.eb{font-family:var(--m); font-size:10.5px; font-weight:500; letter-spacing:.18em;
  text-transform:uppercase; color:var(--v); display:inline-block; margin-bottom:12px;
  padding-left:13px; position:relative}
.eb::before{content:''; position:absolute; left:0; top:50%; width:7px; height:1.5px;
  background:var(--v); transform:translateY(-50%)}
.s.dk .eb{color:var(--nt-v)} .s.dk .eb::before{background:var(--nt-v)}
h2{font-size:35px; font-weight:650; letter-spacing:-.042em; line-height:1.18; color:var(--t-title)}
.lead{font-size:15.5px; line-height:1.68; color:var(--t-mute); margin-top:13px; max-width:920px}
.s.dk .lead{color:var(--nt-mute)}

/* ── 그리드 ── */
.g2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px}
.g22{display:grid; grid-template-columns:1fr 1fr; gap:18px 20px}
.g21{display:grid; grid-template-columns:1.15fr .85fr; gap:20px}
.stack>*+*{margin-top:16px}

/* ── 카드 ── */
.card{border:1px solid var(--line); border-radius:14px; padding:20px 22px; background:var(--white)}
.card.sh{background:transparent; border-color:var(--hair); box-shadow:inset 0 0 0 100vmax rgba(25,23,19,.018)}
.card.ac{border-color:rgba(91,73,216,.26); background:var(--v-05)}
.card.bad{border-color:var(--red-24); background:var(--red-06)}
.card.ok{border-color:var(--grn-24); background:var(--grn-06)}
.s.dk .card{border-color:var(--nt-line); background:var(--night2)}
.card.hl{position:relative; padding-left:24px; border-color:rgba(91,73,216,.24); background:var(--v-05)}
.card.hl::before{content:''; position:absolute; left:0; top:16px; bottom:16px; width:3px;
  border-radius:0 3px 3px 0; background:var(--v)}

.k{font-family:var(--m); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--t-faint); display:block; margin-bottom:9px; font-weight:500}
.k.r{color:var(--red)} .k.v{color:var(--v)} .k.g{color:var(--grn)}
.s.dk .k{color:rgba(251,249,244,.42)}
.h3{font-size:18px; font-weight:650; letter-spacing:-.035em; color:var(--t-title); line-height:1.32}
.h3.sm{font-size:15.5px}
.tx{font-size:14px; line-height:1.72; color:var(--t-body); margin-top:10px}
.tx.sm{font-size:13.2px; line-height:1.68}
.tx+.tx{margin-top:9px}
.s.dk .tx{color:var(--nt-body)}
.mutetx{color:var(--t-faint)}

/* ── 표 ── */
table{width:100%; border-collapse:collapse; font-size:13.4px; line-height:1.55}
th{font-family:var(--m); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--t-faint); font-weight:500; text-align:left;
  padding:0 13px 9px; border-bottom:1.5px solid var(--line)}
td{padding:11px 13px; border-bottom:1px solid var(--hair); vertical-align:top; color:var(--t-body)}
tr:last-child td{border-bottom:0}
td.lb{font-weight:650; color:var(--t-strong); white-space:nowrap}
td.mo{font-family:var(--m); font-size:11.6px; color:var(--v-dp); white-space:nowrap}
tr.hi td{background:var(--v-05)}
tr.hi td:first-child{border-radius:8px 0 0 8px} tr.hi td:last-child{border-radius:0 8px 8px 0}
.s.dk td{color:var(--nt-body); border-color:rgba(251,249,244,.09)}
.s.dk th{color:rgba(251,249,244,.42); border-color:var(--nt-line)}

.pill{display:inline-block; font-family:var(--m); font-size:9.8px; padding:3px 8px;
  border-radius:999px; letter-spacing:.03em; white-space:nowrap; font-weight:500}
.p-no{background:rgba(196,43,82,.10); color:var(--red)}
.p-yes{background:rgba(13,122,78,.10); color:var(--grn)}
.p-mix{background:rgba(25,23,19,.06); color:var(--t-mute)}
.p-v{background:var(--v-16); color:var(--v-dp)}

/* ── 목록 ── */
ul.li{list-style:none}
ul.li li{position:relative; padding-left:17px; font-size:13.6px; line-height:1.72;
  margin-bottom:10px; color:var(--t-body)}
ul.li li:last-child{margin-bottom:0}
ul.li li::before{content:''; position:absolute; left:2px; top:9.5px; width:4.5px; height:4.5px;
  border-radius:50%; background:var(--v); opacity:.75}
.s.dk ul.li li{color:var(--nt-body)}
ul.li.qa li::before{display:none}
ul.li.qa li{padding-left:0}

/* ── 흐름도 ── */
.flow{display:flex; align-items:stretch; gap:0}
.fb{flex:1; border:1px solid var(--line); border-radius:13px; padding:16px 18px; background:var(--white)}
.fa{flex:0 0 30px; display:grid; place-items:center; font-size:14px; color:var(--t-faint)}
.step{display:flex; gap:13px; align-items:flex-start}
.step+.step{margin-top:12px}
.sn{flex:0 0 23px; height:23px; border-radius:50%; background:rgba(25,23,19,.05); color:var(--t-mute);
  font-family:var(--m); font-size:10.5px; display:grid; place-items:center; margin-top:1px}
.step.bad .sn{background:rgba(196,43,82,.11); color:var(--red)}
.step.ok .sn{background:rgba(13,122,78,.11); color:var(--grn)}

/* ── 배너 ── */
.bn{border-radius:12px; padding:15px 19px; font-size:13.6px; line-height:1.68}
.bn.v{background:var(--v-09); border:1px solid rgba(91,73,216,.24); color:var(--t-strong)}
.bn.r{background:var(--red-06); border:1px solid var(--red-24); color:var(--t-strong)}
.bn.g{background:var(--grn-06); border:1px solid var(--grn-24); color:var(--t-strong)}
.s.dk .bn.v{color:var(--nt); background:rgba(140,124,255,.16); border-color:rgba(140,124,255,.36)}

/* ── 계산 블록 ── */
.mb{font-family:var(--m); font-size:12.2px; line-height:1.92; background:var(--paper2);
  border:1px solid var(--hair); border-radius:13px; padding:17px 19px; color:var(--t-strong);
  white-space:pre-wrap}
.mb .dn{color:var(--red)} .mb .up{color:var(--grn)} .mb .mu{color:var(--t-faint)}

/* ── 표지 ── */
.cov{display:flex; flex-direction:column; justify-content:center; height:100%}
.cov h1{font-size:68px; font-weight:700; letter-spacing:-.05em; line-height:1.05; color:var(--nt)}
.cov .sub{font-size:18px; color:var(--nt-mute); margin-top:22px; letter-spacing:-.025em; line-height:1.6}
.cov .meta{display:grid; grid-template-columns:repeat(4,1fr); gap:26px; margin-top:56px;
  padding-top:26px; border-top:1px solid var(--nt-line); max-width:1090px}
.cov .meta .k{color:rgba(251,249,244,.38)}
.cov .meta .v{font-size:13.5px; color:var(--nt); font-weight:500}

/* ── 바닥글 ── */
.foot{position:absolute; left:var(--PAD); right:var(--PAD); bottom:26px; display:flex;
  align-items:center; gap:12px; font-family:var(--m); font-size:9.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--t-faint)}
.foot .ln{flex:1; height:1px; background:var(--hair)}
.s.dk .foot{color:rgba(251,249,244,.32)} .s.dk .foot .ln{background:rgba(251,249,244,.12)}

/* ══════════ 주석 단어 ══════════ */
.an{cursor:pointer; border-bottom:1px dashed rgba(91,73,216,.45); color:inherit;
  padding:0 1px; border-radius:2px; transition:background .15s, border-color .15s; position:relative}
.an::after{content:''; display:inline-block; width:3.5px; height:3.5px; border-radius:50%;
  background:var(--v); vertical-align:super; margin-left:2px; opacity:.7}
.an:hover{background:var(--v-09); border-bottom-color:var(--v)}
.an.act{background:var(--v-16); border-bottom:1px solid var(--v)}
.s.dk .an{border-bottom-color:rgba(182,169,255,.5)}
.s.dk .an:hover{background:rgba(182,169,255,.15)}
.s.dk .an.act{background:rgba(182,169,255,.22); border-bottom-color:var(--nt-v)}

/* ══════════ 주석 카드 ══════════ */
.rail{position:absolute; right:var(--PAD); top:58px; bottom:66px; width:var(--RAIL)}
.rail .hint{font-family:var(--m); font-size:9px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--t-faint); position:absolute; bottom:0; right:0; text-align:right; line-height:1.9;
  opacity:1; transition:opacity .2s}
.rail.busy .hint{opacity:0}
.s.dk .rail .hint{color:rgba(251,249,244,.28)}

.note{position:absolute; left:0; width:var(--RAIL); background:var(--white);
  border:1px solid var(--line); border-radius:13px; padding:14px 16px 15px 18px;
  box-shadow:0 8px 26px rgba(25,23,19,.10); overflow:hidden;
  transition:top .3s cubic-bezier(.4,0,.2,1), opacity .2s; z-index:6}
.note::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--v)}
.note.in{animation:pop .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{opacity:0; transform:translateX(12px)} to{opacity:1; transform:none}}
.note .nk{font-family:var(--m); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--v-dp); background:var(--v-09); padding:3px 7px; border-radius:5px; font-weight:500}
.note .nt{font-size:14px; font-weight:650; letter-spacing:-.03em; color:var(--t-title);
  margin:9px 0 7px; line-height:1.36; padding-right:16px}
.note .nb{font-size:12.2px; line-height:1.7; color:var(--t-body)}
.note .nb+.nb{margin-top:7px}
.note .nb em{color:var(--v-dp); font-weight:650}
.note .x{position:absolute; top:10px; right:11px; width:17px; height:17px; border:0;
  background:none; cursor:pointer; color:var(--t-faint); font-size:14px; line-height:1;
  padding:0; border-radius:4px}
.note .x:hover{color:var(--t-title); background:rgba(25,23,19,.06)}

svg.wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}
svg.wires path{fill:none; stroke:rgba(91,73,216,.55); stroke-width:1.3;
  stroke-dasharray:var(--L); stroke-dashoffset:var(--L); animation:draw .4s ease forwards}
svg.wires circle{fill:var(--v)}
@keyframes draw{to{stroke-dashoffset:0}}
.s.dk svg.wires path{stroke:rgba(182,169,255,.65)} .s.dk svg.wires circle{fill:var(--nt-v)}

/* ══════════ 조작부 ══════════ */
#bar{position:fixed; top:0; left:0; height:2px; background:var(--v); z-index:200; transition:width .3s ease}
#hud{position:fixed; bottom:20px; right:22px; z-index:200; display:flex; align-items:center;
  gap:8px; background:rgba(255,255,255,.94); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 15px;
  box-shadow:0 6px 20px rgba(25,23,19,.12)}
#hud .num{font-family:var(--m); font-size:11px; color:var(--t-mute); letter-spacing:.05em}
#hud .num b{color:var(--t-title)}
#hud button{width:29px; height:29px; border:0; border-radius:50%; background:rgba(25,23,19,.05);
  cursor:pointer; color:var(--t-title); font-size:13px; line-height:1; display:grid; place-items:center}
#hud button:hover{background:var(--v-16); color:var(--v-dp)}
#hud button:disabled{opacity:.28; cursor:default; background:rgba(25,23,19,.05); color:var(--t-title)}
#hud .toc{width:auto; padding:0 12px; border-radius:15px; font-family:var(--m); font-size:10px;
  letter-spacing:.09em; text-transform:uppercase}

#ov{position:fixed; inset:0; z-index:300; background:rgba(252,250,246,.975);
  backdrop-filter:blur(22px); padding:46px 52px; overflow:auto; display:none}
#ov.on{display:block}
#ov .oh{font-family:var(--m); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--v); margin-bottom:22px}
#ovl{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:9px}
#ovl a{display:flex; gap:12px; align-items:baseline; padding:12px 14px; border-radius:11px;
  border:1px solid var(--line); text-decoration:none; background:var(--white); cursor:pointer}
#ovl a:hover{border-color:var(--v); background:var(--v-05)}
#ovl a.cur{border-color:var(--v); background:var(--v-09)}
#ovl .n{font-family:var(--m); font-size:10px; color:var(--t-faint); flex:0 0 20px}
#ovl .t{font-size:13px; color:var(--t-title); font-weight:500; line-height:1.42}
#ovl .g{font-size:9.5px; color:var(--t-faint); margin-left:auto; font-family:var(--m)}

#help{position:fixed; bottom:20px; left:22px; z-index:200; font-family:var(--m);
  font-size:9.5px; letter-spacing:.06em; color:var(--t-mute); line-height:1.9;
  background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:10px;
  padding:9px 13px; backdrop-filter:blur(10px); transition:opacity .5s ease; pointer-events:none}
#help.gone{opacity:0}
#help b{color:var(--t-title); font-weight:600}

@media print{
  body{overflow:visible; background:#fff}
  #stage{position:static; display:block}
  #deck{transform:none !important; box-shadow:none; width:var(--W); height:auto}
  .s{position:relative; inset:auto; opacity:1 !important; visibility:visible !important;
    width:var(--W); height:var(--H); page-break-after:always; break-after:page}
  #hud,#help,#bar,#ov{display:none !important}
  @page{size:1440px 810px; margin:0}
}
</style>
</head>
<body>

<div id="bar"></div>
<div id="stage"><div id="deck"></div></div>

<div id="hud">
  <span class="num"><b id="cur">1</b> / <span id="tot">28</span></span>
  <button class="toc" id="btoc">목차</button>
  <button id="bprev">‹</button>
  <button id="bnext">›</button>
</div>

<div id="help">
  <b>←/→</b> 이동 &nbsp; <b>O</b> 목차 &nbsp; <b>F</b> 전체화면 &nbsp; <b>ESC</b> 주석 닫기<br>
  점선 밑줄이 그어진 단어를 클릭하면 오른쪽에 설명이 붙습니다
</div>

<div id="ov">
  <div class="oh">Syntitan AI-ready Score 완벽 해설 · 목차</div>
  <div id="ovl"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   주석 사전
   근거: 2026-08-06 발표 및 논의, Confluence GST/492011547
   ═══════════════════════════════════════════════════════════ */
const N = {

/* ── 기초 용어 ── */
dataset:['용어','데이터셋 (Dataset)','시스템에 업로드하는 파일 전체, 즉 표 하나입니다. 엑셀로 치면 시트 한 장이라고 보시면 됩니다.','분석의 근간이 되는 원재료입니다.'],
row:['용어','행 (Row)','가로줄 하나입니다. 보통 고객 한 명이나 거래 한 건에 해당합니다.','행이 많을수록 AI가 공부할 사례가 풍부해집니다.'],
col:['용어','컬럼 (Column)','세로줄 하나입니다. 나이, 가입일처럼 하나의 특성을 담은 항목이죠.','항목이 다양할수록 다각적인 분석이 가능하지만, 무관한 항목은 오히려 방해가 됩니다.'],
target:['핵심','타겟 (Target)','AI가 최종적으로 맞혀야 하는 정답 열입니다. 예를 들면 "이 고객이 해지할 예정인가" 열이요.','분석의 최종 목적지입니다. 타겟이 정해지지 않으면 AI는 방향을 잃고, <em>기여도 순위</em>도 계산되지 않습니다.'],
feature:['핵심','피처 (Feature)','정답을 추리하라고 AI에게 던져주는 힌트 열입니다. 정답 열을 뺀 나머지 전부죠.','양질의 피처가 많을수록 예측이 정확해지지만, 무관한 피처는 노이즈가 됩니다.'],
task:['용어','태스크 (Task)','AI에게 시킬 과제의 종류입니다. 둘 중 하나 고르기(이진 분류), 여러 개 중 고르기(다중 분류), 숫자 맞히기(회귀) 세 가지입니다.','문제 유형에 따라 AI가 접근하는 방식이 완전히 달라집니다.'],
nul:['용어','결측 (Null)','값이 수집되지 않아 비어 있는 칸입니다.','그냥 두면 AI가 그 행을 통째로 학습에서 빼거나 연산 에러를 냅니다. <em>FNM</em> 모듈이 다루는 문제입니다.'],
outlier:['용어','이상치 (Outlier)','전체 흐름에서 심하게 벗어난 예외적인 값입니다. 나이 열에 999가 적혀 있는 경우가 대표적이죠.','AI가 규칙을 찾을 때 이 값에 과도하게 끌려가 잘못된 편견을 갖게 만듭니다.'],
dist:['용어','분포 (Distribution)','값들이 어떻게 퍼져 있는지 보여주는 모양입니다. 나이가 20대에 몰려 있는지 골고루 퍼져 있는지 같은 것이죠.','고르게 퍼져 있어야 일반적인 규칙을 찾기 유리합니다.'],
skew:['용어','왜도 (Skewness)','분포가 한쪽으로 쏠린 정도입니다. 0이면 좌우 대칭이고, 클수록 한쪽으로 몰려 있다는 뜻입니다.','실무에서는 절댓값 0.5 이하면 거의 대칭, 1이면 눈에 보이는 쏠림, 2 이상이면 심한 쏠림으로 봅니다. <em>IVM의 2.0 기준은 이 관행을 따른 것</em>이고, 통계학 법칙이 아니라 언제든 바꿀 수 있는 설정값입니다.'],
corr:['용어','상관 (Correlation)','두 세로줄이 얼마나 찰떡같이 함께 움직이는지를 나타냅니다. 0이면 무관, 1에 가까우면 사실상 같은 정보입니다.','키(cm) 열과 키(inch) 열이 딱 그런 사이입니다. 둘 다 주면 AI가 같은 정보를 두 번 배우고 그 요소를 과대평가합니다.'],
cardi:['용어','카디널리티 (Cardinality)','한 세로줄 안에 서로 다른 고유값이 몇 종류나 되는지를 뜻합니다.','성별 열은 2종류, 주민번호 열은 사람 수만큼입니다. 2개면 너무 단순하고 전부 다르면 패턴을 찾을 수 없으니 중간 수준이 이상적입니다.'],
encode:['용어','인코딩 (Encoding)','범주형 값을 숫자로 바꾸는 작업입니다.','AI 모델은 대부분 숫자만 소화하기 때문에 반드시 거쳐야 하고, <em>CAM</em> 모듈이 담당합니다.'],
cate:['용어','범주형과 수치형','수치형은 크기 비교가 의미 있는 숫자입니다(나이, 금액). 범주형은 종류를 나타내는 값입니다(지역, 등급, 성별).','범주형은 숫자로 적혀 있어도 크기 비교가 무의미합니다. 우편번호가 그런 경우죠.'],
rank:['가장 중요','기여도 순위 (importance_rank)','각 컬럼이 정답과 얼마나 관련 있는지 계산해 1등부터 줄 세운 값입니다. 3등 안이면 high, 7등 안이면 medium, 나머지는 low입니다.','FNM이 빈칸을 언제 채울지, feature_relevance와 goal_alignment가 몇 점일지가 전부 이 순위로 정해집니다. 전처리 쪽과 점수 쪽 <em>양쪽에 동시에 물려 있습니다</em>.','문제는 절대값이 아니라 상대값이라는 점입니다. 컬럼을 지우면 남은 컬럼의 등수가 저절로 올라갑니다. 데이터가 좋아진 게 아니라 경쟁자가 사라진 것뿐인데 점수는 오릅니다.'],
leak:['용어','타겟 누수 (Target Leakage)','힌트 컬럼 안에 정답 정보가 스포일러처럼 섞여 들어간 상태입니다.','그 컬럼만 보면 정답이 나오니, 시험 문제지에 답이 적혀 있는 것과 같습니다. <em>CSM</em>이 제거 대상으로 봅니다.'],
colin:['용어','다중공선성','여러 컬럼이 사실상 같은 정보를 담고 있어 모델이 헷갈리는 상태입니다.','태어난 연도와 나이가 둘 다 있는 경우가 그렇습니다. redundancy 지표가 재는 대상이죠.'],
imbal:['용어','클래스 불균형','정답의 한쪽이 지나치게 적은 상태입니다. "예" 10건에 "아니오" 9,990건 같은 경우요.','<em>RAM</em>이 다루는 문제인데, 정작 이걸 재는 지표가 6축 점수에 없습니다.'],

/* ── 시스템 ── */
prof:['모듈','진단 (Profiling)','데이터를 전체적으로 훑어보고 어떤 성격인지, 각 컬럼이 무슨 역할인지 파악하는 1번 기계입니다.','정밀 건강검진으로 몸 상태를 꼼꼼히 재는 단계입니다. 첫 진단이 틀리면 전처리 추천도 6축 점수도 도미노처럼 연달아 틀어집니다.'],
edit:['모듈','전처리 (EditData)','진단 결과를 바탕으로 손볼 방법을 추천하고, 사용자가 승인하면 실제로 데이터를 고치는 2번 기계입니다.','검진 결과를 보고 의사가 처방을 내리고 환자가 약을 먹는 단계입니다. 시스템은 추천만 하고, 실제로 바뀌는 건 사용자가 화면에서 클릭한 항목뿐입니다.'],
score:['모듈','AI-ready Score','지금 데이터의 품질과 학습 적합도를 평가해 점수를 매기는 3번 기계입니다.','건강 상태를 종합해 최종 검진 점수표를 발행하는 단계죠. 문제는 2번이 개선하는 기준과 3번이 평가하는 기준이 서로 다르다는 점입니다.'],
lang:['도구','LangGraph','여러 단계와 조건 분기를 가진 AI 파이프라인을 만드는 도구입니다.','우리 진단의 12단계 파이프라인이 이걸로 만들어졌습니다.'],
agent:['용어','에이전트','정해진 역할을 맡아 판단을 내리는 LLM 하나를 뜻합니다. 우리 진단 파이프라인에는 11개가 있습니다.','파이프라인이 공정 순서라면 에이전트는 그 자리에서 일하는 사람입니다. Task Type, Target Column, Column Role, Target Type, Semantic, Quick Eval, Dataset Name, Integrity Diag, Conciseness Diag, Contextuality Diag, Input Sufficiency 열한 명이죠.'],
node:['용어','노드','파이프라인의 한 단계입니다.','12개 노드가 순서대로 돌고, 그중 일부에서 LLM 에이전트가 개입해 판단을 내립니다.'],
meta:['용어','메타데이터','데이터에 대한 데이터입니다. 이 컬럼이 무슨 뜻인지, 얼마나 비었는지를 적어 둔 설명서라고 보시면 됩니다.','컬럼 하나당 41개 항목, 데이터셋 전체로 48개 항목을 채웁니다. 빈칸의 의미까지 설명하는 이 구조에 붙인 제품 이름이 <em>Meta-Array</em>입니다.'],
halluc:['리스크','환각 (Hallucination)','LLM이 실제 데이터에는 없는 내용을 혼자 상상해서 지어내는 현상입니다.','실제 엑셀의 숫자는 10인데 컬럼 이름만 보고 "이 수치는 100입니다"라고 답한 버그 사례가 보고되어 있습니다.'],
repro:['리스크','재현성 문제','완전히 똑같은 데이터를 다시 넣어도 LLM이 그때그때 미묘하게 다른 대답을 하는 문제입니다.','"어제는 90점을 줬는데 오늘 같은 파일에 85점을 준다"가 여기서 나옵니다. Context 비중을 키우자는 논의에 걸린 가장 큰 리스크죠.'],
anon:['리스크','익명화의 역설','컬럼 이름을 c1, c2로 가려 두면 안의 숫자가 완벽하게 같아도 LLM이 뜻을 짐작하지 못해 semantic_coverage가 0이 되고 Context 점수가 무너집니다.','지금은 버그처럼 보이지만, "AI가 읽고 이해할 수 있는가"가 품질의 핵심 기준이라면 <em>오히려 정확한 평가</em>라는 해석도 가능합니다. 결론 슬라이드의 방향과 이어지는 이야기입니다.'],

/* ── 전처리 모듈 ── */
fnm:['모듈','FNM · Feature-wise Null Management','빈칸 처리 모듈입니다. 두 가지를 함께 합니다. "이 칸이 원래 비어 있었다"를 기록하는 신호 컬럼을 하나 만들고, 빈칸 자체는 중간값이나 최빈값으로 채웁니다.','결측률이 30%를 넘으면 무조건 시행하고, 그 이하는 기여도에 따라 high 1%, medium 5%, low 10%를 기준선으로 씁니다.','점수 영향은 거의 없습니다. FNM이 개선하는 completeness가 6축 안에 들어 있지 않기 때문입니다.'],
ivm:['모듈','IVM · Invalid Value Management','값 다듬기 모듈입니다. 이상값 잘라내기(clip), 로그 변환, 범주 통합, 스케일 정규화 네 가지를 합니다.','왜도 절댓값이 2.0을 넘거나 정상 범위 밖 값이 5%를 넘을 때 실행합니다. 두 조건은 OR이라 하나만 걸려도 발동합니다.','실측에서 <em>트리 계열 ML 모델 성능을 올린 경우가 0건</em>이었고, LLM 쪽에서는 9건 개선되었습니다. 점수에는 반영되지 않습니다.'],
csm:['모듈','CSM · Column Selection Management','필요 없는 열을 지우는 모듈입니다. 중요도가 매우 낮은 열, 정답이 새어 들어간 열, 다른 열과 정보가 너무 겹치는 열 세 종류를 봅니다.','구체적 임계값은 <em>미확인</em>입니다. 발표 자료에 숫자가 실려 있지 않습니다.','점수 영향이 세 방향으로 엇갈려서 총합을 미리 예측할 수 없습니다.'],
cam:['모듈','CAM · Column Augmentation Management','항목을 숫자로 바꾸는 모듈입니다. 카디널리티가 지나치게 높은 범주형(상품코드 3,000종 같은 것)을 단일 숫자형으로 변환합니다.','BTE는 각 값이 정답과 얼마나 연결되는지를 숫자로, Frequency는 그 값이 몇 번 나타나는지를 숫자로 바꿉니다.','실측에서 ML 11건, LLM 8건 개선으로 <em>유일하게 양쪽 다 좋았던 모듈</em>입니다.'],
ram:['모듈','RAM · Row Augmentation Management','부족한 쪽 행을 늘리는 모듈입니다. 원본의 패턴을 모방하는 CART 방식으로 소수 클래스를 가상 생성해 균형을 맞춥니다.','실측에서 결함 16종 중 14종에서 ML 성능을 올려 <em>5개 모듈 중 효과가 가장 큽니다</em>. 그런데 중복행이 늘어 Integrity 점수는 깎입니다.','주의할 점 하나. 진단 결과의 ram.base_level, ram.final_level은 컴퓨터 메모리 필요량이고 이 모듈과는 무관합니다.'],
ipm:['모듈','IPM · Intent & Purpose Management','사용자에게 목적과 컬럼 의미를 직접 되묻는 진단 전용 모듈입니다. 데이터 값을 고치는 게 아니라 설명을 채웁니다.','<em>점수를 확실히 올리는 유일한 경로</em>입니다. input_sufficiency와 semantic_coverage를 동시에 밀어 올립니다.','다만 지금은 화면에 연결되어 있지 않습니다. 연결하려면 프론트엔드를 바꿔야 하고, 바꾼 뒤에도 "데이터를 안 고쳤는데 점수가 오른다"를 어떻게 설명할지가 기획 과제로 남습니다.'],
cart:['방식','CART','RAM이 쓰는 가짜 행 생성 방식입니다. 기존 데이터의 패턴을 나무 모양 규칙으로 학습한 다음, 그 규칙을 따라 비슷한 새 행을 만듭니다.','무작위가 아니라 기존 관계를 따라 만든다는 게 장점입니다. 그런데 <em>따라 만든다는 건 원본에 있던 특징이 새 행에도 그대로 복사된다는 뜻</em>이기도 합니다. 중복 패턴까지 복제됩니다.'],
iqr:['방식','IQR fence','정상 범위를 정하는 방법입니다. 값들을 크기순으로 줄 세워 4등분한 뒤, 가운데 절반이 차지하는 폭의 1.5배만큼 양옆으로 울타리를 칩니다.','상자그림에서 점으로 튀어나온 값들이 바로 이 울타리 밖 값입니다. 비율을 셀 때 분모에 빈칸은 넣지 않습니다. 빈칸이 많은 컬럼일수록 이상치 비율이 작게 계산되는 걸 막기 위해서입니다.'],
clip:['방식','클리핑 (clip)','정상 범위를 넘어가는 값을 범위 끝값으로 잘라내는 것입니다. IVM이 합니다.'],
logt:['방식','로그 변환','한쪽으로 쏠린 분포를 완만하게 펴는 수학 변환입니다. IVM이 합니다.','왜도가 0에 가까워지긴 합니다. 다만 그게 더 좋은 데이터라고 말할 근거는 없다는 것이 회의의 지적이었습니다.'],
scale:['방식','스케일 정규화','컬럼마다 숫자 크기 범위가 달라서 생기는 불균형을 맞추는 것입니다.','방 개수는 1에서 5, 거리는 100에서 5000이라면 AI가 거리를 1000배 중요하다고 착각하니, 출발선을 맞춰 주는 거죠.'],
bte:['방식','BTE 인코딩','범주값 각각이 정답과 얼마나 연결되는지를 숫자로 바꾸는 방식입니다.','그 상품을 산 사람들의 이탈률을 계산해 0.85라는 위험도 숫자로 바꾸는 식입니다.'],
freq:['방식','Frequency 인코딩','범주값이 몇 번 나타나는지를 숫자로 바꾸는 방식입니다.','그 상품이 5,000번 팔렸다면 5000이라는 인기도 숫자가 됩니다.'],

/* ── 6축과 지표 ── */
integ:['축','Integrity (정합성)','데이터 내용을 계산식으로 재서 0에서 1 사이 점수를 냅니다. duplicate_ratio와 type_consistency의 평균이고 가중치는 각각 0.5입니다.','전처리로 움직이는 축입니다. <em>RAM이 이 축을 떨어뜨립니다.</em>'],
consis:['축','Consistency (일관성)','산식 이름은 conciseness_score입니다. feature_relevance, redundancy, cardinality_efficiency 세 지표의 평균이고 가중치는 각각 3분의 1입니다.','전처리로 움직이는 축입니다. <em>CSM이 이 축을 엇갈리게 만듭니다.</em>'],
ctx:['축','Context (맥락)','산식 이름은 contextuality_score입니다. semantic_coverage, goal_alignment, input_sufficiency 세 지표의 평균입니다.','재료 일부가 LLM 판단이라 재현성 리스크를 안고 있습니다. IPM이 확실히 올리는 축이고, 회의에서 비중 확대에 가장 많은 동의를 받았습니다.'],
usab:['축','Usability (유용성)','개인정보 컬럼이 하나라도 있으면 0, 없으면 1입니다. 중간이 없는 스위치죠.','원래는 위험 컬럼 수에 따라 감점하는 계산식이었는데 지금은 이진 방식입니다. 컬럼 1개와 30개를 같은 점수로 취급합니다.'],
reprod:['축','Reproducibility (재현성)','데이터 내용과는 무관합니다. 플랫폼이 남기는 기록을 체크리스트로 세어 체크된 항목을 전체로 나눕니다. 12항목입니다.','플랫폼이 자동으로 수행하는 기능이라 늘 체크되어 <em>항상 100점이 나옵니다</em>. 원본 정의 문서도 "데이터셋별 품질 점수가 아니라 플랫폼 커버리지로 읽을 것"이라고 스스로 경고하고 있습니다.'],
trace:['축','Traceability (추적성)','재현성과 같은 방식입니다. 7항목짜리 체크리스트 커버리지입니다.','누가 언제 변경했는지 기록하는가, 확정본으로 상태를 고정할 수 있는가, 두 확정본을 비교할 수 있는가 같은 항목이고 각각 O/X입니다.'],

dup:['지표','duplicate_ratio · 중복행 적음','완전히 똑같은 가로줄이 몇 개인지를 봅니다. 1에서 중복행수를 전체행수로 나눈 값을 뺍니다.','같은 행이 여러 번 있으면 AI가 그 패턴을 실제보다 중요하다고 착각합니다. <em>RAM이 행을 늘리면 이 값이 떨어져 Integrity가 깎입니다.</em>'],
typec:['지표','type_consistency · 타입 일관','컬럼에 실제로 들어 있는 값의 형태가 지정된 형태와 맞는지 봅니다.','숫자 컬럼에 글자가 섞여 있으면 데이터가 어딘가에서 손상된 것이고 계산이 깨집니다. 전처리로 크게 움직이지는 않습니다.'],
frel:['지표','feature_relevance · 타겟 관련성','정답과 관련이 깊은 컬럼의 비율입니다. high와 medium 기여 컬럼 수를 기여도가 계산된 컬럼 수로 나눕니다.','<em>순위 기반이라 CSM으로 컬럼을 지우면 남은 컬럼 등수가 올라 이 값이 상승합니다.</em>'],
redun:['지표','redundancy · 비중복성','컬럼끼리 얼마나 안 겹치는지입니다. 1에서 컬럼 쌍별 상관 절댓값의 평균을 뺍니다.','이름은 중복도지만 실제 의미는 비중복도, 다양성에 가깝습니다. uniqueness로 이해하시면 됩니다.','<em>평균이라 상관 낮은 컬럼이 빠지면 이 값이 하락합니다.</em> 컬럼을 지우는 어떤 전처리도 이 함정을 피할 수 없습니다.'],
cardE:['지표','cardinality_efficiency · 카디널리티 적정','값 종류 수가 적정한 범주형 컬럼의 비율입니다. 적정 기준은 고유값 비율 0.01에서 0.30 사이입니다.','<em>CAM이 범주형을 수치형으로 바꾸면 분모 자체가 줄어 이 값이 오를 수 있습니다.</em>'],
semc:['지표','semantic_coverage · 의미 설명 커버','설명이 붙어 있는 컬럼의 비율입니다. 설명 있는 피처수를 전체 피처수로 나눕니다.','여기서 말하는 설명은 <em>LLM이 생성한 설명</em>이라, 컬럼명이 c1이면 설명을 못 붙여 이 값이 떨어집니다.'],
goal:['지표','goal_alignment · 목표 정렬','기여도가 low가 아닌 컬럼의 비율입니다. 즉 순위 7등 이내 비율이죠.','이것도 순위 기반이라 CSM과 함께 움직입니다.'],
insuf:['지표','input_sufficiency · 입력 충분성','사용자가 적은 목적과 데이터 구성이 서로 맞는지를 LLM 에이전트가 0에서 1 사이로 직접 채점합니다. 목적을 안 적으면 0.0입니다.','"고객 이탈을 예측하고 싶다"고 적었는데 데이터에 이탈 여부가 없으면 애초에 불가능한 요청이고, 그걸 잡아냅니다. <em>IPM으로 목적을 받으면 0.0에서 바로 올라갑니다.</em>'],
compl:['미반영 지표','completeness · 결측 적음','빈칸이 적은 정도입니다. 1에서 null_ratio를 뺀 뒤 컬럼 중요도로 가중평균합니다.','<em>FNM이 하는 일이 바로 빈칸 채우기인데, 그 결과가 6축 점수에 반영되지 않습니다.</em>'],
dstab:['미반영 지표','distribution_stability · 분포 안정성','왜도와 이상치가 적어 분포가 안정적인 정도입니다.','<em>IVM이 하는 일이 정확히 이걸 개선하는 건데 점수에 안 들어갑니다.</em> 가장 문제가 되는 항목입니다.'],
labrel:['미반영 지표','label_reliability · 라벨 신뢰도','정답 컬럼 자체가 믿을 만한지 봅니다. 타겟의 completeness와 distribution_stability를 절반씩 씁니다.','대응하는 전처리 모듈이 없습니다. 정답이 틀렸으면 나머지가 다 좋아도 의미가 없는데 점수에 없습니다.'],
metai:['미반영 지표','metadata_integrity · 메타 완전성','우리가 만든 메타데이터가 빠짐없이 채워진 정도입니다.','진단이 얼마나 잘 됐는지를 나타내는 지표인데 점수에 없습니다.'],
trust:['묶음','trust_score','completeness, label_reliability, distribution_stability, metadata_integrity 네 지표가 속한 별도 묶음입니다.','값은 계산되어 진단 결과에 저장되지만 <em>6축 점수에는 반영되지 않습니다</em>. 원래 "이 데이터를 에이전트에 넣어도 되는가"를 판정하는 게이트 용도로 설계되어 6축과 계보가 다릅니다.','2026-06-30 개선 과제에 1순위 이슈로 적혀 있었고 완료 처리되었는데도 여전히 점수 밖입니다. 어디까지 반영되었는지는 AI팀 확인이 필요합니다.'],

/* ── 기능과 쟁점 ── */
proofrun:['기능','Proof Run','전처리 전과 후의 실제 AI 모델 성능을 같은 조건으로 비교해서 보여주는 기능입니다.','같은 모델, 같은 채점 기준, 같은 데이터 분할, 같은 랜덤 시드를 씁니다. 1차 버전은 이진 분류만 지원합니다.','PRD에 "모델 성능 전처리로 AI-Ready Score는 낮아질 수 있음을 함께 안내함"이라고 <em>제품이 스스로 인정</em>하고 있습니다.'],
proofkit:['기능','Proof Kit','사용자가 자기 환경에서 같은 비교를 다시 돌려볼 수 있게 원본 데이터, 전처리된 데이터, 실행 코드 3종을 묶어 내려받는 기능입니다.','1차 포함 방향이지만 범위와 개인정보 처리는 검토 중입니다.'],
tree:['배경','트리 계열 모델','LightGBM, XGBoost처럼 요즘 실무에서 많이 쓰는 모델입니다.','이미 빈칸이나 이상치, 값의 크기 차이를 스스로 무시할 만큼 맷집이 강합니다. <em>우리가 치워주려던 장애물이 요즘 모델에겐 애초에 방해거리가 아니었던 겁니다.</em>'],
gener:['내부 용어','범용 전처리','어떤 데이터에든 적용하면 대체로 좋아지는 전처리만 남기자는 개념입니다.','<em>내부 용어이며 고객에게는 쓰지 않습니다.</em> 그렇게 걸러내면 남는 게 거의 없다는 것이 회의에서 나온 반론이었습니다.'],
dts:['제품','DTS','데이터를 합성 데이터로 변환하는 우리 기술입니다.','Syntitan이 차별점을 갖는 이유가 결국 DTS가 합쳐졌기 때문이라는 의견이 회의에서 나왔고, DTS의 가치를 점수 산식에 가중해 넣는 방향도 검토 대상입니다.'],
relstate:['기능','Release State','정제된 데이터 상태를 봉인해서 나중에 그대로 꺼낼 수 있게 만드는 기능입니다.','Traceability 축의 체크리스트 항목 중 하나로 들어갑니다.'],
quick:['에이전트','Quick Eval','빠른 기계학습 검증 실험을 설계하는 에이전트입니다. 10번 노드에서 동작합니다.','"이 데이터를 이대로 쓰면 어떤 위험이 있나"를 정리하는 리스크 분석과 함께 진행됩니다.'],
gov:['노드','governance_metadata_node','거버넌스 권고와 전처리 제안을 남기는 11번 노드입니다.','지금은 사용자 화면으로 연결되는 선이 끊어져 있습니다. 그런데 이 노드가 판별한 개인정보 여부는 <em>Usability 점수를 결정하는 유일한 재료</em>로 쓰입니다. 화면에 안 보일 뿐 내부 계산에는 100% 쓰이고 있는 셈이죠.']
};

      <p class="tx sm">6축으로 점수를 매깁니다. 그런데 전처리 후에 다시 계산하면 <b>점수가 그대로거나 오히려 떨어집니다</b></p></div>
  </div>
  <div class="g2">
    <div class="bn r">이 문서가 파고드는 지점이 바로 마지막 칸입니다. 분명히 개선했는데 점수가 안 오르거나, 심지어 떨어집니다.</div>
    <div class="bn v">그래서 별도로 ${a('proofrun','Proof Run')}이라는 기능이 기획되었습니다. 전처리가 실제 AI 성능을 올렸는지를 점수와 별개로 직접 재는 장치입니다.</div>
  </div>
</div>`},

/* 05 ─ 3대의 기계 */
{sec:'ROOT CAUSE', title:'3대의 독립된 기계', html:`
<div class="hd cw">
  <span class="eb">The Root Cause</span>
  <h2>먼저 알아야 할 사실, 3대의 독립된 기계</h2>
  <p class="lead">Syntitan의 AI-ready 기능은 처음부터 끝까지 이어지는 하나의 덩어리가 아닙니다. 역할이 다른 세 대의 기계가 나란히 놓여 있고, 이들이 딱 맞물려 있지 않다는 것이 지금 벌어지는 모든 논쟁의 뿌리입니다.</p>
</div>
<div class="cw">
  <table style="margin-bottom:18px">
    <tr><th style="width:70px">기계</th><th style="width:150px">이름</th><th>하는 일</th><th style="width:220px">한 줄 비유</th></tr>
    <tr><td class="mo">1번</td><td class="lb">${a('prof','진단 · Profiling')}</td><td>데이터를 훑어보고 이게 무슨 데이터인지, 각 ${a('col','컬럼')}이 무슨 역할인지 파악</td><td>건강검진에서 몸 상태를 측정</td></tr>
    <tr><td class="mo">2번</td><td class="lb">${a('edit','전처리 · EditData')}</td><td>진단 결과를 보고 손봐야 한다고 추천하고, 승인하면 실제로 수정</td><td>의사가 약을 처방하고 환자가 먹음</td></tr>
    <tr class="hi"><td class="mo">3번</td><td class="lb">${a('score','AI-ready Score')}</td><td>데이터 상태를 6축으로 평가해 점수화</td><td>건강검진 종합 점수표 발행</td></tr>
  </table>
  <div class="card bad">
    <span class="k r">여기가 핵심 문제입니다</span>
    <p class="tx" style="margin-top:2px"><b>2번이 데이터를 개선하는 기준과 3번이 평가하는 기준이 서로 다릅니다.</b> 약을 먹고 몸은 분명 좋아졌는데 검진 점수는 그대로이거나 떨어지는 상황이죠. 처방전과 검진 항목표가 애초에 다른 것을 보고 있기 때문입니다.</p>
    <div class="g2" style="margin-top:14px">
      <div class="step bad"><span class="sn">①</span><div style="font-size:13px;line-height:1.66">전처리가 문제를 고쳤는데 <b>점수가 그 항목을 애초에 재고 있지 않습니다.</b> 그래서 총점은 그대로입니다<br><span class="mutetx">${a('fnm','FNM')}, ${a('ivm','IVM')}이 여기 해당합니다</span></div></div>
      <div class="step bad"><span class="sn">②</span><div style="font-size:13px;line-height:1.66">전처리가 문제를 고쳤는데 <b>고치는 과정에서 생긴 부작용만 점수가 잡아냅니다.</b> 총점은 떨어집니다<br><span class="mutetx">${a('ram','RAM')}, ${a('csm','CSM')}이 여기 해당합니다</span></div></div>
    </div>
  </div>
</div>`},

/* 06 ─ 용어 1 */
{sec:'TERMINOLOGY', title:'기초 용어 1 · 데이터의 형태', html:`
<div class="hd cw">
  <span class="eb">Terminology 1 / 4</span>
  <h2>0부터 시작하는 기초 용어, 데이터의 형태</h2>
</div>
<div class="cw g22">
  <div class="card"><span class="k">${a('dataset','데이터셋')} · Dataset</span><div class="h3">엑셀 시트 한 장</div>
    <p class="tx sm">표 하나 전체를 말합니다. 우리 제품에 업로드하는 원본 파일 그 자체이고, 여기서부터 모든 분석이 시작됩니다.</p></div>
  <div class="card"><span class="k">${a('nul','결측')} · Null</span><div class="h3">비어 있는 칸</div>
    <p class="tx sm">아무것도 안 적힌 빈 셀입니다. AI는 빈칸을 스스로 계산할 수 없어 당황합니다. 그냥 두면 그 행을 통째로 버리거나 연산 에러를 내기 때문에, 버리든 채우든 결정을 해줘야 합니다.</p></div>
  <div class="card"><span class="k">${a('row','행')} / ${a('col','컬럼')} · Row / Column</span><div class="h3">가로줄 1건 / 세로줄 1항목</div>
    <p class="tx sm">행은 보통 고객 한 명이나 거래 한 건입니다. 컬럼은 A열은 이름, B열은 나이처럼 하나의 특성을 나타내는 항목이고요.</p></div>
  <div class="card"><span class="k">${a('outlier','이상치')} · Outlier</span><div class="h3">혼자만 엉뚱하게 튀는 별종</div>
    <p class="tx sm">나이 칸에 999가 적혀 있는 것처럼 정상 범위를 한참 벗어난 값입니다. AI가 "999살이면 무조건 해지하는구나"라는 엉뚱한 규칙을 만들게 하는 주범이죠.</p></div>
</div>`},

/* 07 ─ 용어 2 */
{sec:'TERMINOLOGY', title:'기초 용어 2 · 통계 특성', html:`
<div class="hd cw">
  <span class="eb">Terminology 2 / 4</span>
  <h2>0부터 시작하는 기초 용어, 통계 특성</h2>
</div>
<div class="cw g22">
  <div class="card"><span class="k">${a('dist','분포')} / ${a('skew','왜도')} · Skewness</span><div class="h3">값들의 퍼짐과 쏠림</div>
    <p class="tx sm">분포는 값들이 흩어진 모양이고, 왜도는 그중에서도 한쪽으로 치우친 정도입니다. 연봉 데이터를 떠올려 보시면 됩니다. 대부분 평범하고 소수만 엄청나게 높아서 꼬리가 길게 늘어지죠. 이럴 때 왜도가 크다고 말합니다.</p></div>
  <div class="card"><span class="k">${a('corr','상관')} · Correlation</span><div class="h3">얼마나 똑같이 움직이는가</div>
    <p class="tx sm">두 세로줄이 얼마나 찰떡같이 함께 움직이는지를 나타냅니다. 1에 가까울수록 키(cm) 열과 키(inch) 열처럼 사실상 100% 똑같은 중복 정보라는 뜻입니다.</p></div>
  <div class="card" style="grid-column:1/-1"><span class="k">${a('cardi','카디널리티')} · Cardinality</span><div class="h3">메뉴, 즉 종류의 가짓수</div>
    <p class="tx sm">하나의 세로줄 안에 겹치지 않는 서로 다른 종류가 총 몇 개나 되는지를 뜻합니다. 성별 열은 남녀 2종류뿐이라 카디널리티가 낮고, 주민번호 열은 사람 수만큼 전부 달라서 아주 높습니다.
      너무 낮으면 알려주는 정보가 없고, 너무 높으면 패턴을 찾을 수가 없습니다. 그래서 중간이 이상적입니다.</p></div>
</div>`},

/* 08 ─ 용어 3 */
{sec:'TERMINOLOGY', title:'기초 용어 3 · 정답과 힌트', html:`
<div class="hd cw">
  <span class="eb">Terminology 3 / 4</span>
  <h2>가장 중요한 개념, 정답과 힌트</h2>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="card"><span class="k">${a('target','타겟')} · Target</span><div class="h3">정답 열</div>
      <p class="tx sm">AI가 최종적으로 맞혀야 하는 정답 세로줄입니다. "이 고객이 다음 달에 해지할 것인가" O/X 열이 대표적인 예입니다.</p></div>
    <div class="card"><span class="k">${a('feature','피처')} · Feature</span><div class="h3">힌트 열</div>
      <p class="tx sm">정답을 추리하라고 AI에게 던져주는 재료들입니다. 타겟을 제외한 나이, 가입기간 등 나머지 모든 열이 피처가 됩니다.</p></div>
  </div>
  <div class="stack">
    <div class="card bad"><span class="k r">주의 · ${a('leak','타겟 누수')}</span><div class="h3">정답지를 몰래 훔쳐보는 부정행위 힌트</div>
      <p class="tx sm">"내일 우산 판매량"으로 "내일 비가 오는가"를 맞히는 격입니다. 시험지에 답이 같이 적혀 있는 셈이라 학습 자체가 무의미해집니다. ${a('csm','CSM')}이 이런 컬럼을 찾아내 지웁니다.</p></div>
    <div class="card hl"><span class="k v">문서 전체를 관통하는 개념</span><div class="h3">${a('rank','기여도 순위')}</div>
      <p class="tx sm">각 컬럼이 정답과 얼마나 관련 있는지를 계산해 1등부터 줄 세운 값입니다. 3등 안이면 high, 7등 안이면 medium, 나머지는 low죠. 전처리 쪽과 점수 쪽 <b>양쪽에 동시에 물려 있어서</b>, 뒤에서 볼 사고 대부분이 사실 여기서 출발합니다.</p></div>
  </div>
</div>`},

/* 09 ─ 용어 4 */
{sec:'TERMINOLOGY', title:'기초 용어 4 · 태스크와 인코딩', html:`
<div class="hd cw">
  <span class="eb">Terminology 4 / 4</span>
  <h2>태스크와 데이터 타입</h2>
</div>
<div class="cw g2">
  <div class="card"><span class="k">${a('task','태스크')} · Task</span><div class="h3">AI에게 시킬 시험 문제의 종류</div>
    <ul class="li" style="margin-top:13px">
      <li><b>이진 분류</b> · O/X 퀴즈 풀기. 이 고객이 이탈할까, 안 할까?</li>
      <li><b>다중 분류</b> · 객관식 문제 풀기. A, B, C 등급 중 무엇일까?</li>
      <li><b>회귀</b> · 주관식 숫자 맞히기. 내일 매출액은 얼마일까?</li>
    </ul>
    <p class="tx sm" style="margin-top:14px">어떤 유형이냐에 따라 AI 모델이 접근하는 방식이 완전히 달라집니다.</p></div>
  <div class="card"><span class="k">${a('encode','인코딩')} · Encoding</span><div class="h3">${a('cate','수치형과 범주형')}의 번역</div>
    <p class="tx sm">컬럼은 수치형과 범주형으로 나뉩니다. 수치형은 크기 비교가 되는 숫자(연봉), 범주형은 종류를 표시하는 값(지역, 남녀)이고요. 우편번호는 숫자로 적혀 있지만 크기 비교가 무의미하니 범주형입니다.</p>
    <p class="tx sm">그런데 AI 모델은 대부분 숫자만 먹습니다. 그래서 텍스트로 된 범주형을 숫자로 번역해 줘야 하고, 이 작업을 인코딩이라고 부릅니다. ${a('cam','CAM')} 모듈이 담당합니다.</p></div>
</div>`},

/* 10 ─ 진단 파이프라인 */
{sec:'PHASE 1', title:'1단계 진단 파이프라인', html:`
<div class="hd cw">
  <span class="eb">Phase 1 · Profiling</span>
  <h2>1단계 진단, 12노드 파이프라인</h2>
  <p class="lead">사용자가 파일을 올리면 ${a('lang','LangGraph')} 기반의 12단계 파이프라인이 돌고, 중간중간 11개의 ${a('agent','LLM 에이전트')}가 개입해 사람처럼 문맥을 읽고 판단을 내립니다.</p>
</div>
<div class="cw">
  <table>
    <tr><th style="width:50px">순서</th><th style="width:182px">${a('node','노드')}</th><th>하는 일을 사람의 말로 풀면</th><th style="width:86px">LLM 판단</th></tr>
    <tr><td class="mo">1</td><td class="mo">scan_node</td><td>표를 펼쳐서 몇 행 몇 열인지, 빈칸은 몇 개인지, ${a('dist','분포')}는 어떤지 기계적으로 세기</td><td><span class="pill p-mix">순수 계산</span></td></tr>
    <tr><td class="mo">2</td><td class="mo">determine_task_type</td><td>이 표로 풀 문제가 분류인지 회귀인지 ${a('task','태스크')} 판정하기</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">3</td><td class="mo">derive_target_column</td><td>"이 표에서 맞혀야 할 ${a('target','정답')}은 churn 열이다" 콕 집어 결정하기. 여기서 정답이 정해져야 ${a('rank','기여도 순위')}가 계산됩니다</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">4</td><td class="mo">derive_column_role</td><td>"이 열은 정답, 이 열은 단순 순번, 이 열은 ${a('feature','힌트')}" 딱지 붙이기. useless 판정이 ${a('csm','CSM')} 제거 대상으로 이어집니다</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">6</td><td class="mo">column_metadata_node</td><td>컬럼 하나당 41개 ${a('meta','메타데이터')} 항목을 채우기. 전처리 판정의 핵심 기준이 됩니다</td><td><span class="pill p-mix">순수 계산</span></td></tr>
    <tr class="hi"><td class="mo">7</td><td class="mo">semantic_node</td><td>"cust_tenure_m은 고객 이용 개월 수입니다"라고 사람의 언어로 설명서 쓰기 → ${a('semc','semantic_coverage')}</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">9</td><td class="mo">ipm_node</td><td>정보가 부족하면 "이 컬럼은 무슨 뜻이에요?"라고 사용자에게 되묻기 → ${a('insuf','input_sufficiency')}</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">10</td><td class="mo">risk_metadata_node</td><td>리스크 분석과 ${a('quick','Quick Eval')} 실험 설계. 지금은 화면으로 가는 선이 끊겨 있습니다</td><td><span class="pill p-v">있음</span></td></tr>
    <tr><td class="mo">11</td><td class="mo">${a('gov','governance_metadata')}</td><td>거버넌스 권고와 전처리 제안. 여기서 판별한 개인정보 여부가 ${a('usab','Usability')} 점수의 유일한 재료입니다</td><td><span class="pill p-v">있음</span></td></tr>
  </table>
</div>`},

/* 11 ─ LLM 한계 */
{sec:'PHASE 1', title:'LLM 판단의 한계', html:`
<div class="hd cw">
  <span class="eb">The LLM Dilemma · 문제 1</span>
  <h2>"LLM이 판단한다"의 치명적인 한계</h2>
  <p class="lead">사람이 엑셀 파일을 처음 열었을 때 하는 짐작, 그러니까 "아 이건 고객 유지 기간이구나" 같은 판단을 LLM에게 대신 시키는 구조입니다. 편리하지만 약점 세 가지를 함께 안고 갑니다.</p>
</div>
<div class="cw">
  <div class="g3" style="margin-bottom:18px">
    <div class="card bad"><span class="k r">약점 1</span><div class="h3 sm">${a('repro','재현성 부족')}</div>
      <p class="tx sm">완전히 같은 데이터를 다시 물어봐도 그때그때 다른 대답이 나옵니다. 어제 90점이던 파일이 오늘은 85점이 되는 식이죠.</p></div>
    <div class="card bad"><span class="k r">약점 2</span><div class="h3 sm">${a('anon','이름표 의존')}과 ${a('halluc','환각')}</div>
      <p class="tx sm">컬럼명이 c1, c2로 익명화되어 있으면 안의 숫자가 똑같아도 뜻을 짐작할 수 없어 점수가 깎입니다. 반대로 이름만 그럴듯하면 없는 사실을 지어내기도 합니다.</p></div>
    <div class="card bad"><span class="k r">약점 3</span><div class="h3 sm">맥락 한 줄에 평가가 뒤집힘</div>
      <p class="tx sm">같은 날씨 데이터인데 "정글에서 측정했다"고 하면 정상, "한국이다"라고 하면 이상 데이터가 됩니다. 평가가 180도 바뀌죠.</p></div>
  </div>
  <div class="bn v">숫자는 단 하나도 바뀌지 않았는데 배경 설명 한 줄로 데이터의 운명이 갈립니다.
    지금은 이게 버그처럼 보이지만, <b>19장에서 오히려 제품이 나아갈 방향으로 다시 검토됩니다.</b> 잠시 기억해 두시면 좋겠습니다.</div>
</div>`},

/* 12 ─ 도메인 지식 부재 */
{sec:'PHASE 1', title:'도메인 지식의 부재', html:`
<div class="hd cw">
  <span class="eb">Missing Context · 문제 2</span>
  <h2>도메인 지식을 아는 에이전트가 없다</h2>
  <p class="lead">11개 ${a('agent','에이전트')}를 하나씩 뜯어보면 전부 통계와 형식만 보는 친구들입니다. 이 데이터가 현실 세계의 어느 업종에서 나온 것인지 판단하는 에이전트는 단 하나도 없습니다.</p>
</div>
<div class="cw g2">
  <div class="card"><span class="k">지금 입력받고 있는 것</span><div class="h3">의도 · Intent</div>
    <p class="tx sm">"이걸로 매출 예측을 할 거야" 같은 단순한 작업 목표입니다. ${a('ipm','IPM')}이 받아내는 정보가 딱 여기까지입니다.</p></div>
  <div class="card bad"><span class="k r">부족한 것</span><div class="h3">도메인 지식 · Domain</div>
    <p class="tx sm">"이 데이터는 강남 부동산 매출이야" 같은, 데이터가 수집된 현장의 배경지식입니다. 이걸 봐줄 사람이 지금 구조에는 없습니다.</p></div>
</div>
<div class="cw" style="margin-top:18px">
  <div class="bn v">문제 1이 "LLM이라 판단이 흔들린다"였다면, 문제 2는 <b>"애초에 그걸 볼 담당자가 없다"</b>입니다.
    회의에서 "시스템 앞단에 이 데이터가 무엇인지 더 명확하게 파악하는 단계가 있어야 한다"는 주장이 나온 이유가 이것입니다.</div>
</div>`},

/* 13 ─ 전처리 6모듈 */
{sec:'PHASE 2', title:'전처리 6개 모듈', html:`
<div class="hd cw">
  <span class="eb">Phase 2 · EditData</span>
  <h2>2단계 전처리, 6개 모듈</h2>
  <p class="lead">진단이 끝나면 "이 데이터는 이런 손질이 필요합니다"라고 시스템이 추천합니다. 어디까지나 추천이고, 실제로 데이터가 바뀌는 것은 사용자가 화면에서 클릭한 항목뿐입니다.</p>
</div>
<div class="cw">
  <table>
    <tr><th style="width:58px">약어</th><th style="width:262px">정식 명칭</th><th>쉽게 말하면</th><th style="width:112px">점수 영향</th></tr>
    <tr><td class="mo">FNM</td><td class="lb">${a('fnm','Feature-wise Null Management')}</td><td><b>빈칸 처리.</b> 비어 있었다는 사실 자체를 신호 컬럼으로 기록하고, ${a('nul','빈칸')}은 중간값이나 최빈값으로 채우기</td><td><span class="pill p-mix">거의 없음</span></td></tr>
    <tr><td class="mo">IVM</td><td class="lb">${a('ivm','Invalid Value Management')}</td><td><b>값 다듬기.</b> ${a('outlier','튀는 값')}을 자르고, 쏠린 ${a('dist','분포')}를 펴고, 숫자 크기 범위를 맞추기</td><td><span class="pill p-mix">거의 없음</span></td></tr>
    <tr><td class="mo">CSM</td><td class="lb">${a('csm','Column Selection Management')}</td><td><b>필요 없는 열 지우기.</b> 정답에 도움이 안 되거나 ${a('leak','타겟 누수')}가 있거나 다른 열과 겹치는 열 삭제</td><td><span class="pill p-no">엇갈림</span></td></tr>
    <tr><td class="mo">CAM</td><td class="lb">${a('cam','Column Augmentation Management')}</td><td><b>항목 숫자화.</b> 종류가 방대한 문자형 범주 데이터를 AI가 읽을 수 있는 숫자로 번역</td><td><span class="pill p-yes">소폭 상승</span></td></tr>
    <tr><td class="mo">RAM</td><td class="lb">${a('ram','Row Augmentation Management')}</td><td><b>행 증강.</b> 정답 비율이 극도로 적은 쪽의 가짜 행을 ${a('cart','CART')}로 만들어 채우기</td><td><span class="pill p-no">하락</span></td></tr>
    <tr class="hi"><td class="mo">IPM</td><td class="lb">${a('ipm','Intent &amp; Purpose Management')}</td><td><b>사용자에게 되묻기.</b> 값이 아니라 누락된 목적과 설명을 물어 맥락을 채우기</td><td><span class="pill p-yes">확실히 상승</span></td></tr>
  </table>
  <div class="bn v" style="margin-top:18px">실행 순서는 <b>FNM → IVM → CSM → CAM → RAM으로 고정</b>되어 있습니다.
    RAM이 맨 마지막이라, RAM이 만든 부작용을 뒤에서 정리해 줄 방법이 없습니다. 이 점이 23장에서 문제가 됩니다.</div>
</div>`},

/* 14 ─ 판정 3단계 */
{sec:'PHASE 2', title:'추천 판정 3단계', html:`
<div class="hd cw">
  <span class="eb">Phase 2 · 판정 로직</span>
  <h2>시스템은 어떻게 "이걸 해야 한다"고 정할까요</h2>
  <p class="lead">모듈을 통째로 켜고 끄는 게 아니라, 컬럼 하나하나를 먼저 보고 나서 모듈 단위로 모읍니다.</p>
</div>
<div class="cw">
  <div class="flow" style="margin-bottom:18px">
    <div class="fb"><span class="k">1단계</span><div class="h3 sm">컬럼 하나하나 판정</div>
      <p class="tx sm">컬럼 A는 ${a('fnm','FNM')}이 필요하고, 컬럼 B는 필요 없고, 컬럼 C는 ${a('ivm','IVM')}이 필요하다. 이렇게 컬럼 단위로 먼저 봅니다.</p></div>
    <div class="fa">›</div>
    <div class="fb"><span class="k">2단계</span><div class="h3 sm">모듈 단위로 모으기</div>
      <p class="tx sm"><b>컬럼이 하나라도 걸리면 그 모듈 전체가 켜집니다.</b> 100개 중 딱 1개만 문제여도 추천 대상이 된다는 뜻입니다.</p></div>
    <div class="fa">›</div>
    <div class="fb"><span class="k">3단계</span><div class="h3 sm">화면에 표시</div>
      <p class="tx sm">필요하면 pending으로 눌러볼 수 있게, 필요 없으면 skipped로 표시합니다. 사용자가 클릭해야 비로소 실행됩니다.</p></div>
  </div>
  <div class="card hl">
    <span class="k v">숫자 기준이 명시된 모듈은 둘뿐입니다</span>
    <p class="tx" style="margin-top:2px">발표 자료에 정확한 임계값이 적혀 있는 모듈은 <b>${a('fnm','FNM')}과 ${a('ivm','IVM')}</b> 두 개입니다.
      ${a('csm','CSM')}, ${a('cam','CAM')}, ${a('ram','RAM')} 세 개는 여러 순위와 상관값, 리소스 한도가 섞인 복합 판단이라 단일 임계값으로 표현되지 않고, <b>구체적 수치는 미확인</b>입니다. 코드를 보거나 AI팀에 확인이 필요한 사항입니다.</p>
  </div>
</div>`},

/* 15 ─ FNM */
{sec:'MODULE', title:'FNM · 결측치 처리', html:`
<div class="hd cw">
  <span class="eb">Module Deep Dive</span>
  <h2>${a('fnm','FNM')}, 빈칸을 채우는 일과 숨은 함정</h2>
</div>
<div class="cw g2">
  <div class="stack">
    <div class="card"><span class="k">판정 기준 · 중요한 열일수록 깐깐하게</span>
      <ul class="li" style="margin-top:12px">
        <li><b>30% 넘게 비었으면 무조건 처리합니다.</b> 3분의 1 이상 비었으면 어차피 못 쓰는 상태라는 판단이죠</li>
        <li><b>중요한 열은 1%만 비어도 처리합니다.</b> ${a('rank','기여도')} high 기준 0.01</li>
        <li><b>안 중요한 열은 10%까지 놔둡니다.</b> medium 0.05, low 0.10. 굳이 손대서 원본을 훼손하지 않겠다는 뜻입니다</li>
      </ul></div>
    <div class="card sh"><span class="k">Q. 중간값으로 대치하면 통계가 왜곡되지 않나요?</span>
      <p class="tx sm">왜곡됩니다. 다만 빈칸을 그대로 두면 학습 자체가 안 되거나 연산 에러가 나기 때문에, 왜곡을 감수하고 채우는 쪽을 택한 것입니다.
        그래서 FNM은 값을 채우는 동시에 "이 칸은 원래 비어 있었다"는 신호 컬럼을 따로 만들어 둡니다. 왜곡의 흔적을 남겨 두는 장치인 셈이죠.</p></div>
  </div>
  <div class="card bad"><span class="k r">문제 3 · 회의에서 지적된 진짜 문제</span><div class="h3">빈칸이 정보일 수도 있다</div>
    <p class="tx">빈칸이 늘 단순한 누락은 아닙니다. 예를 들어 "해지 사유" 컬럼이 비어 있다면 그게 무슨 뜻일까요? 데이터가 누락된 게 아니라 <b>그 고객이 해지를 안 했다</b>는 명확한 사실일 수 있습니다.</p>
    <p class="tx">이걸 다른 사람들의 평균 해지 사유로 무턱대고 채워 버리면, 없던 사실을 지어내는 셈이 되고 원래 성능을 오히려 깎아먹습니다.</p>
    <p class="tx">지금 시스템은 이 둘을 구분하지 못합니다. 구분하려면 빈칸이 왜 비어 있는지를 알아야 하는데, 그건 데이터만 들여다봐서는 알 수 없고 <b>사람에게 물어봐야 하는 정보</b>입니다. ${a('ipm','IPM')}이 왜 중요한지가 여기서 나옵니다.</p></div>
</div>`},

/* 16 ─ IVM */
{sec:'MODULE', title:'IVM · 분포와 이상치', html:`
<div class="hd cw">
  <span class="eb">Module Deep Dive</span>
  <h2>${a('ivm','IVM')}, 그리고 왜도 2.0이라는 관행</h2>
</div>
<div class="cw g2">
  <div class="card"><span class="k">판정 기준 · 하나만 맞아도 발동</span>
    <ul class="li" style="margin-top:12px">
      <li><b>${a('skew','왜도')} 절댓값이 2.0을 넘으면</b> 한쪽으로 심하게 쏠린 꼬리를 ${a('logt','로그 변환')}으로 강제로 펴 버립니다</li>
      <li><b>${a('outlier','이상치')}가 5%를 넘으면</b> 정상 울타리(${a('iqr','IQR fence')}) 밖 값을 ${a('clip','클리핑')}으로 끝값에서 잘라냅니다</li>
      <li><b>${a('scale','스케일 정규화')}</b> · 방 개수(1에서 5)와 거리(100에서 5000)를 그대로 두면 AI가 거리를 1000배 중요하다고 착각하니 출발선을 맞춰 줍니다</li>
    </ul>
    <p class="tx sm" style="margin-top:14px">여기서 왜도 2.0은 통계학 법칙이 아니라 <b>업계 경험치</b>입니다. 자료 어디에도 왜 하필 2.0이어야 하는지가 증명되어 있지 않은, 언제든 조정 가능한 설정값입니다.</p></div>
  <div class="card bad"><span class="k r">문제 4 · 가장 날카로웠던 회의 지적</span><div class="h3">왜도가 크면 나쁜 데이터인가?</div>
    <p class="tx">연봉 데이터는 원래 왜도가 큽니다. 지진 규모도, 도시 인구도, 상품 판매량도 마찬가지고요. 데이터가 망가진 게 아니라 <b>세상이 원래 그런 모양</b>입니다.</p>
    <p class="tx">그런데 IVM은 이를 강제로 펴서 0에 가깝게 만듭니다. 왜도가 0에 가까워졌다고 해서 더 좋은 데이터라고 말할 근거는 어디에도 없습니다.</p>
    <p class="tx">실측이 이 지적을 뒷받침합니다. 결함 16종 실험에서 <b>IVM이 ${a('tree','트리 계열 ML 모델')} 성능을 올린 경우는 0건</b>이었습니다. 오히려 망가뜨린 쪽이었죠. 반면 LLM이 데이터를 읽는 경우에는 9건에서 좋아졌습니다. "왜도 처리는 빠지는 게 맞다"는 의견이 나온 이유입니다.</p></div>
</div>`},

/* 17 ─ CSM / CAM */
{sec:'MODULE', title:'CSM · CAM', html:`
<div class="hd cw">
  <span class="eb">Module Deep Dive</span>
  <h2>${a('csm','CSM')} 컬럼 제거와 ${a('cam','CAM')} 숫자화</h2>
</div>
<div class="cw g2">
  <div class="card"><span class="k">CSM · ${a('colin','다중공선성')}과 ${a('leak','타겟 누수')} 차단</span><div class="h3">중복 힌트와 스포일러 지우기</div>
    <p class="tx sm">"태어난 연도(1990)"와 "나이(34)"가 둘 다 있으면 어떻게 될까요? 모델은 같은 계산을 두 번 하고, 이 정보를 2배 중요하다고 부풀려 착각합니다. 그래서 대표 하나만 남기고 지웁니다.</p>
    <p class="tx sm">또 앞서 본 우산 판매량처럼 정답이 새어 들어간 컬럼도 찾아내 삭제하고, 단순 순번 컬럼도 제거 대상입니다.</p>
    <p class="tx sm mutetx">판정 재료는 ${a('rank','중요도 순위')}, 기여 강도, 컬럼 신뢰도, 타겟과의 ${a('corr','상관')}, 다른 컬럼과의 상관입니다. 구체적 임계값은 미확인입니다.</p></div>
  <div class="card"><span class="k">CAM · ${a('encode','인코딩')}과 증강</span><div class="h3">텍스트를 확률과 인기로 번역</div>
    <p class="tx sm">AI가 못 읽는 상품코드 3,000종을 어떻게 할까요? ${a('cardi','카디널리티')}가 지나치게 높은 범주형을 단일 숫자로 바꿔 줍니다.</p>
    <ul class="li" style="margin-top:12px">
      <li><b>${a('bte','BTE')} 방식</b> · 그 상품을 산 사람의 이탈률을 계산해 0.85라는 위험도 숫자로</li>
      <li><b>${a('freq','Frequency')} 방식</b> · 그 상품이 몇 번 팔렸는지 5000이라는 인기도 숫자로</li>
    </ul>
    <p class="tx sm" style="margin-top:12px">텍스트를 기계가 읽는 맥락으로 옮겨 주는 작업입니다. 실측에서 <b>ML 11건, LLM 8건 개선으로 유일하게 양쪽 다 좋았던 모듈</b>입니다.</p></div>
</div>`},

/* 18 ─ RAM */
{sec:'MODULE', title:'RAM · 행 증강', html:`
<div class="hd cw">
  <span class="eb">Module Deep Dive</span>
  <h2>${a('ram','RAM')} 행 증강, 그리고 AI의 꼼수</h2>
</div>
<div class="cw g2">
  <div class="card"><span class="k">${a('imbal','클래스 불균형')}과 AI의 꼼수</span><div class="h3">왜 가짜 행을 만들까요</div>
    <p class="tx sm">신용카드 결제 1만 건 중 정상이 9,990건, 사기가 10건(0.1%)이라고 해봅시다.</p>
    <p class="tx sm">AI는 사기범의 특징을 힘들게 공부하지 않습니다. 그냥 <b>"전부 정상 결제입니다"라고 찍어 버리죠.</b> 그래도 정답률이 99.9%가 나오니까요.</p>
    <p class="tx sm">이 꼼수를 막으려고 RAM은 ${a('cart','CART')} 합성 방식으로 부족한 사기 데이터와 유사한 가짜 행을 수백 건 만들어, 양팔 저울의 균형을 억지로 맞춥니다.</p>
    <p class="tx sm"><b>실측에서 결함 16종 중 14종에서 ML 성능을 올린, 5개 모듈 중 효과가 가장 큰 모듈입니다.</b></p></div>
  <div class="card bad"><span class="k r">문제점 · 원본의 노이즈도 뻥튀기된다</span><div class="h3">CART 복제의 대가</div>
    <p class="tx sm">CART는 원본 데이터의 패턴을 정교하게 따라 만듭니다. 무작위가 아니라 기존 관계를 따라 만든다는 게 이 방식의 장점이죠.</p>
    <p class="tx sm">그런데 만약 원본 10건 안에 <b>똑같은 중복 결제 내역</b>이 섞여 있었다면 어떻게 될까요? 새로 만든 수백 건도 그 중복 패턴을 그대로 복제해 뻥튀기하게 됩니다.</p>
    <p class="tx sm">그 결과 ${a('dup','duplicate_ratio')}가 떨어지고 ${a('integ','Integrity')} 점수가 깎입니다. 완벽한 만능키가 아니라 분명한 약점이 있는 기술입니다. 제품이 제 할 일을 했는데 점수가 나빠지는 구조죠.</p></div>
</div>`},

/* 19 ─ Context의 마법 */
{sec:'INSIGHT', title:'전처리의 한계와 Context의 가치', dark:true, html:`
<div class="hd cw">
  <span class="eb">The Magic of Context</span>
  <h2>전처리의 한계, 그리고 LLM의 진짜 가치</h2>
  <p class="lead">기존 전처리는 데이터를 다루기 쉽게 재포장할 뿐, 없던 정보를 만들어내지는 못합니다. 성능을 획기적으로 올리는 방법은 ${a('ctx','의미')}를 재해석하는 것입니다.</p>
</div>
<div class="cw g2">
  <div class="card"><span class="k">기존 방식 · 압축</span><div class="h3">${a('cam','CAM')}이 하는 일</div>
    <p class="tx">수천 개의 약물 이름 데이터를 그저 등장 횟수라는 단순한 숫자로 접어 버립니다.</p>
    <p class="tx">표 안에 있는 정보를 재배열할 뿐이라 <b>정보량의 천장이 원본에 묶여 있습니다.</b> 원래 데이터에 단서가 없으면 아무리 예쁘게 다듬어도 거기까지입니다.</p></div>
  <div class="card" style="border-color:rgba(140,124,255,.42); background:rgba(140,124,255,.14)"><span class="k" style="color:var(--nt-v)">LLM 방식 · 재해석</span><div class="h3">표 밖의 지식을 가져온다</div>
    <p class="tx">LLM 에이전트에게 맥락을 주면 "아세트아미노펜은 해열진통제다"라는 <b>표 밖의 세상 지식</b>을 끌어옵니다.</p>
    <p class="tx">기존에는 없었던 "진통제인가 아닌가"라는 완전히 새로운 축을 데이터에 추가해 주고, 모델은 이 힌트를 바탕으로 즉시 더 높은 적중률을 만들어냅니다.</p></div>
</div>
<div class="cw" style="margin-top:18px">
  <div class="bn v">데이터를 직접 고치지 않아도, <b>이 데이터가 어떤 의미인지 설명해 주는 것만으로 성능이 일관되게 오릅니다.</b> 이것이 Context가 중요한 진짜 이유입니다.
    반대로 열 이름이 c1, c2로 숨겨져 있으면 세상 지식을 연결할 수가 없어 이 방식이 통하지 않습니다. ${a('anon','11장에서 본 익명화 문제')}가 사실은 버그가 아닐 수도 있는 이유죠.</div>
</div>`},

/* 20 ─ 6축 */
{sec:'PHASE 3', title:'AI-ready Score 6축 구조', html:`

<div class="cw">
  <table>

    <tr class="hi"><td class="lb">${a('integ','Integrity')}</td><td>정합성</td><td>데이터 내용(중복도, 타입 오류)을 계산식으로 잽니다</td><td><b style="color:var(--red)">움직입니다</b> · RAM이 떨어뜨림</td></tr>
    <tr class="hi"><td class="lb">${a('consis','Consistency')}</td><td>일관성</td><td>데이터 내용(상관관계, 무관한 열)을 계산식으로 잽니다</td><td><b style="color:var(--red)">움직입니다</b> · CSM이 엇갈리게 함</td></tr>
    <tr class="hi"><td class="lb">${a('ctx','Context')}</td><td>맥락</td><td>LLM 판단과 목적 적합성을 섞어서 잽니다</td><td><b style="color:var(--grn)">움직입니다</b> · IPM이 확실히 올림</td></tr>
    <tr><td class="lb">${a('usab','Usability')}</td><td>유용성</td><td>개인정보가 하나라도 있으면 0점, 없으면 1점. 중간이 없는 스위치입니다</td><td>거의 안 움직입니다</td></tr>
    <tr><td class="lb">${a('reprod','Reproducibility')}</td><td>재현성</td><td>데이터 내용을 아예 안 봅니다. 플랫폼이 기록을 잘 남기는지 체크리스트로 셉니다</td><td>안 움직입니다</td></tr>
    <tr><td class="lb">${a('trace','Traceability')}</td><td>추적성</td><td>같은 방식입니다. ${a('relstate','Release State')}처럼 플랫폼이 자동 수행하는 7개 항목의 O/X</td><td>안 움직입니다</td></tr>
  </table>
  <div class="g2" style="margin-top:18px">
    <div class="bn v">회의에서 <b>위쪽 3축 이야기만 나오는 이유</b>가 맨 오른쪽 열에 있습니다. 전처리와 점수가 어긋나는 사고는 위쪽 3축에서만 벌어지거든요.</div>
    <div class="bn r"><b>문제 5, 6.</b> 아래 3축은 논쟁거리가 아니어서 빠진 게 아니라 각자 다른 이유로 문제를 안고 있습니다. 재현성과 추적성은 <b>플랫폼이 자동으로 하니 언제나 100점</b>이고, Usability는 개인정보 컬럼 1개와 30개를 같은 점수로 취급합니다.</div>
  </div>
</div>`},

/* 21 ─ 12개 지표 */
{sec:'PHASE 3', title:'12개 지표, 그중 8개만 점수에', html:`

  <p class="lead">각 축은 하위 지표들의 <b>평균</b>입니다. 절대량이 아니라 평균이라는 점을 기억해 두세요. 컬럼을 지우거나 늘리면 분모가 같이 바뀌기 때문에, 24장의 함정이 여기서 생깁니다.</p>

    <div class="k" style="margin-bottom:9px">점수에 반영되는 8개</div>

      <tr><td class="mo">${a('goal','goal_alignment')}</td><td>목적에 쓸모 있는 열이 많은가 · Context</td></tr>

  </div>

/* 22 ─ 역설 1 */
{sec:'PARADOX', title:'역설 1 · 고쳤는데 점수가 안 오른다', html:`
<div class="hd cw">
  <span class="eb">The Score Paradox 1 · 문제 7</span>
  <h2>열심히 고쳤는데 점수가 안 오릅니다</h2>
  <p class="lead">전처리(2단계)가 개선한 것을 점수(3단계)가 아예 재지 않는, 첫 번째 부조리입니다.</p>
</div>
<div class="cw g2">
  <div class="card bad"><span class="k r">${a('fnm','FNM')} · 빈칸 처리의 경우</span><div class="h3">completeness가 6축 밖에 있습니다</div>
    <p class="tx sm">FNM은 빈칸을 채웁니다. 그리고 빈칸이 적은 정도를 재는 ${a('compl','completeness')} 지표도 우리가 이미 계산하고 있습니다.</p>
    <p class="tx sm">그런데 이 지표가 6축 산식에는 들어가지 않습니다. 속으로 계산만 해두고 쓰지 않는 거죠. <b>따라서 FNM을 아무리 눌러도 점수는 1점도 오르지 않습니다.</b></p></div>
  <div class="card bad"><span class="k r">${a('ivm','IVM')} · 분포와 이상치의 경우</span><div class="h3">distribution_stability도 마찬가지입니다</div>
    <p class="tx sm">IVM은 쏠린 분포를 폅니다. 분포가 안정적인지 재는 ${a('dstab','distribution_stability')} 역시 계산은 하고 있고요.</p>
    <p class="tx sm">그런데 이것도 점수에 반영되지 않습니다. 기껏 정규분포로 예쁘게 깎아 놔도, <b>건강검진 종합 점수표에 그 항목이 애초에 빠져 있는 셈</b>입니다.</p></div>
</div>
<div class="cw" style="margin-top:18px">
  <div class="bn r">결과적으로 <b>5개 전처리 모듈 중 FNM과 IVM 두 개는 점수를 올리는 데 직접 기여하지 않습니다.</b> 사용자는 열심히 버튼을 눌러 데이터를 개선했는데, 화면의 숫자는 꿈쩍도 하지 않는 상황입니다.</div>
</div>`},

/* 23 ─ 역설 2 */
{sec:'PARADOX', title:'역설 2 · RAM을 쓰면 점수가 깎인다', html:`
<div class="hd cw">
  <span class="eb">The Score Paradox 2 · 문제 8</span>
  <h2>${a('ram','RAM')}을 쓰면 점수가 무조건 깎입니다</h2>
  <p class="lead">안 오르는 것보다 더 심각한 상황이 있습니다. 시스템이 시키는 대로 했는데 점수가 떨어지는 경우입니다.</p>
</div>
<div class="cw g2">
  <div class="mb">[전처리 전]
전체 1000행 · 중복행 50행
정답 분포 예 30건 / 아니오 970건 <span class="mu">(심한 불균형)</span>
<span class="up">duplicate_ratio = 1 − 50/1000 = 0.95</span>  <span class="mu">좋은 편</span>

[RAM 발동]
예 30건을 <span class="mu">CART로</span> 300건까지 복제 증강
원본 30건에 이미 중복이 섞여 있었다면
새로 만든 270건에도 <span class="dn">그 중복 패턴이 그대로</span>

[전처리 후]
전체 1270행 · 중복행 50 + 새로 생긴 다수
<span class="dn">duplicate_ratio 급락</span>
        ↓
<span class="dn">integrity_score 하락 → 총점 하락</span></div>
  <div class="stack">
    <div class="card bad"><span class="k r">제품이 제 할 일을 했는데 벌을 받습니다</span>
      <p class="tx sm" style="margin-top:2px">RAM은 실측에서 <b>결함 16종 중 14종에서 ${a('tree','트리 계열 ML 모델')} 성능을 올려 준 효자 모듈</b>입니다. 그런데 그 대가로 중복행이 늘어났다는 이유 하나만으로 ${a('integ','Integrity')}가 깎입니다.</p></div>
    <div class="card"><span class="k">더 근본적인 지적</span>
      <p class="tx sm" style="margin-top:2px">원본 자체가 중복이 나올 수밖에 없는 데이터라면 어떻게 해야 할까요? 수능 답안지는 값이 1번부터 5번까지뿐이라 행이 겹치는 게 불가피합니다. 그런데 지금 시스템은 데이터의 성질을 무시하고 ${a('dup','중복률')}이라는 숫자 하나만 기계적으로 봅니다. 그래서 처음부터 낮게 나옵니다.</p></div>
    <div class="bn r">이상한 점이 하나 더 있습니다. <b>중복행을 점수에는 넣고 있는데, 정작 중복을 제거하는 전처리 모듈은 없습니다.</b> 사용자에게 중복 때문에 점수가 깎였다고 보여주면서 고칠 도구는 주지 않는 셈입니다.</div>
  </div>
</div>`},

/* 24 ─ 역설 3 */
{sec:'PARADOX', title:'역설 3 · 평균의 함정', html:`
<div class="hd cw">
  <span class="eb">The Score Paradox 3 · 문제 9</span>
  <h2>쓰레기를 버렸더니 남은 물이 탁해진다?</h2>
  <p class="lead">${a('csm','CSM')}으로 컬럼을 지웠을 때 ${a('consis','Consistency')} 점수가 깎이는, 산수의 함정입니다.</p>
</div>
<div class="cw g2">
  <div class="mb">[전처리 전] 컬럼 5개
컬럼 쌍별 상관 값: 0.9, 0.8, 0.1, 0.1, 0.1, 0.1 …
<span class="mu">무관한 컬럼이 많아서</span> 상관 평균 = 0.3
<span class="up">redundancy = 1 − 0.3 = 0.7</span>

[CSM 실행] 기여도 낮은 컬럼 2개 제거
지워진 건 <span class="mu">대체로 다른 컬럼과 무관했던</span> 컬럼
즉 상관이 낮았던 0.1 쌍들이 <span class="dn">계산에서 빠짐</span>

[전처리 후] 컬럼 3개
남은 상관 값: 0.9, 0.8, 0.1 → 평균 = 0.6
<span class="dn">redundancy = 1 − 0.6 = 0.4  하락</span>
        ↓
<span class="dn">conciseness_score 하락 → 총점 하락</span></div>
  <div class="stack">
    <div class="card bad"><span class="k r">밀도, 즉 평균 계산의 딜레마</span>
      <p class="tx sm" style="margin-top:2px">${a('redun','redundancy')}는 남은 컬럼들끼리의 <b>상관도 평균</b>을 봅니다. 무관하고 겉도는 열을 지우면 전체 중복량은 분명히 줄어드는데, 남은 핵심들끼리의 밀도는 수학적으로 치솟습니다. 시스템은 평균이 높아진 것만 보고 "내용 중복이 심해졌다"며 억울하게 감점합니다.</p>
      <p class="tx sm"><b>컬럼을 지우는 어떤 전처리도 이 함정을 피할 수 없습니다.</b></p></div>
    <div class="card"><span class="k">작은 데이터의 비극</span>
      <p class="tx sm" style="margin-top:2px">100명 중 2명이 같은 주장을 하면 2%지만, 3명 중 2명이 같은 주장을 하면 66% 중복입니다. 컬럼 수가 3개나 4개뿐인 작은 데이터는 아무리 완벽하게 정제해도 이 평균 계산 방식 때문에 <b>무조건 낮은 Consistency 점수를 받을 수밖에 없습니다.</b> 실무진도 이 불공평함을 인지하고 있습니다.</p></div>
    <div class="card sh"><span class="k">버튼 하나에 세 지표가 서로 다른 방향으로</span>
      <ul class="li" style="margin-top:10px">
        <li>상관 낮은 쌍이 빠짐 → 평균 상승 → <b style="color:var(--red)">${a('redun','redundancy')} 하락</b></li>
        <li>남은 컬럼의 ${a('rank','등수')}가 저절로 올라감 → <b style="color:var(--grn)">${a('frel','feature_relevance')} 상승</b></li>
        <li>같은 이유로 low가 아닌 비율이 늘어남 → <b style="color:var(--grn)">${a('goal','goal_alignment')} 상승</b></li>
      </ul>
      <p class="tx sm" style="margin-top:11px">총점이 오를지 내릴지는 데이터마다 다르고 <b>미리 예측할 수가 없습니다.</b> 고객에게 "이걸 누르시면 점수가 오릅니다"라고 안내할 수 없다는 뜻이죠.</p></div>
  </div>
</div>`},

/* ═══════════════════════════════════════════════════════════
   렌더링 · 네비게이션 · 주석
   ═══════════════════════════════════════════════════════════ */
const deck = document.getElementById('deck');
const W = 1440, H = 810;
let idx = 0, k = 1;

SLIDES.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 's' + (s.dark ? ' dk' : '');
  el.dataset.i = i;
  el.innerHTML = s.html;

  // 제목(.hd)만 남기고 나머지 본문 블록을 .bd로 감싼다
  const hd = el.querySelector(':scope > .hd');
  const bd = document.createElement('div');
  bd.className = 'bd';
  [...el.children].forEach(c => { if (c !== hd) bd.appendChild(c); });
  el.appendChild(bd);

  if (!s.cover){
    el.insertAdjacentHTML('beforeend',
      `<div class="rail"><div class="hint">단어를 클릭하면<br>여기에 설명이 붙습니다</div></div>
       <svg class="wires"></svg>
       <div class="foot"><span>${s.sec}</span><span class="ln"></span><span>${String(i+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}</span></div>`);
  }
  deck.appendChild(el);
});

const slides = [...deck.querySelectorAll('.s')];
document.getElementById('tot').textContent = SLIDES.length;

/* ── 뷰포트 맞춤 ── */
function fit(){
  const pad = 60;
  k = Math.min((innerWidth - pad) / W, (innerHeight - pad) / H);
  deck.style.transform = `scale(${k})`;
}
addEventListener('resize', () => { fit(); relayout(); });
new ResizeObserver(() => { fit(); relayout(); }).observe(document.documentElement);
fit();

/* ── 슬라이드 이동 ── */
function go(n){
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  if (n === idx) return;
  closeAll(slides[idx]);
  slides[idx].classList.remove('on');
  idx = n;
  slides[idx].classList.add('on');
  sync();
}
function sync(){
  document.getElementById('cur').textContent = idx + 1;
  document.getElementById('bar').style.width = ((idx + 1) / SLIDES.length * 100) + '%';
  document.getElementById('bprev').disabled = idx === 0;
  document.getElementById('bnext').disabled = idx === SLIDES.length - 1;
  [...document.querySelectorAll('#ovl a')].forEach((a, i) => a.classList.toggle('cur', i === idx));
}
slides[0].classList.add('on');
sync();

setTimeout(() => document.getElementById('help').classList.add('gone'), 7000);

document.getElementById('bprev').onclick = () => go(idx - 1);
document.getElementById('bnext').onclick = () => go(idx + 1);

addEventListener('keydown', e => {
  const ov = document.getElementById('ov');
  if (e.key === 'Escape'){
    if (ov.classList.contains('on')) { ov.classList.remove('on'); return; }
    closeAll(slides[idx]); return;
  }
  if (e.key === 'o' || e.key === 'O' || e.key === 'ㅐ'){ ov.classList.toggle('on'); return; }
  if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
    return;
  }
  if (e.key === '?'){ document.getElementById('help').classList.remove('gone'); return; }
  if (ov.classList.contains('on')) return;
  if (['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(idx + 1); }
  if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(idx - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(SLIDES.length - 1);
});

/* ── 목차 ── */
const ovl = document.getElementById('ovl');
SLIDES.forEach((s, i) => {
  const a = document.createElement('a');
  a.innerHTML = `<span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${s.title}</span><span class="g">${s.sec}</span>`;
  a.onclick = () => { go(i); document.getElementById('ov').classList.remove('on'); };
  ovl.appendChild(a);
});
document.getElementById('btoc').onclick = () => document.getElementById('ov').classList.toggle('on');

/* ── 주석 ── */
function closeAll(slide){
  slide.querySelectorAll('.note').forEach(n => n.remove());
  slide.querySelectorAll('.an.act').forEach(t => t.classList.remove('act'));
  const sv = slide.querySelector('svg.wires'); if (sv) sv.innerHTML = '';
  const r = slide.querySelector('.rail'); if (r) r.classList.remove('busy');
}

deck.addEventListener('click', e => {
  const term = e.target.closest('.an');
  if (!term) return;
  const slide = term.closest('.s');
  if (!slide.querySelector('.rail')) return;
  const key = term.dataset.n;
  if (!N[key]) return;

  // 같은 단어를 다시 누르면 닫는다
  const mine = slide.querySelector(`.note[data-for="${termId(term)}"]`);
  if (mine){ dropNote(mine); relayout(); return; }
  // 같은 용어가 다른 자리에서 열려 있으면 그쪽을 닫고 여기로 옮긴다
  const dup = slide.querySelector(`.note[data-n="${key}"]`);
  if (dup) dropNote(dup);

  term.classList.add('act');
  const [kind, title, ...body] = N[key];
  const note = document.createElement('div');
  note.className = 'note in';
  note.dataset.n = key;
  note.dataset.for = termId(term);
  note.dataset.seq = ++seq;
  note.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <span class="nk">${kind}</span>
    <div class="nt">${title}</div>
    ${body.map(b => `<p class="nb">${b}</p>`).join('')}`;
  note.querySelector('.x').onclick = ev => {
    ev.stopPropagation(); dropNote(note); relayout();
  };
  slide.querySelector('.rail').appendChild(note);
  relayout();
});

let seq = 0;
function dropNote(note){
  const t = document.querySelector(`.an[data-tid="${note.dataset.for}"]`);
  if (t) t.classList.remove('act');
  note.remove();
}

let tid = 0;
function termId(el){
  if (!el.dataset.tid) el.dataset.tid = 't' + (++tid);
  return el.dataset.tid;
}

/* 카드 위치 계산 + 연결선 */
function relayout(){
  const slide = slides[idx];
  const rail = slide.querySelector('.rail');
  const svg = slide.querySelector('svg.wires');
  if (!rail || !svg) return;

  svg.innerHTML = '';
  const sr = slide.getBoundingClientRect();
  const rr = rail.getBoundingClientRect();
  const railTop = (rr.top - sr.top) / k;
  const railH = rr.height / k;
  const railX = (rr.left - sr.left) / k;

  // 여백에 담을 수 있는 양을 넘으면 먼저 연 카드부터 자동으로 닫는다
  let notes = [...rail.querySelectorAll('.note')];
  const hOf = n => n.getBoundingClientRect().height / k;
  while (notes.length > 1 &&
         notes.reduce((a, n) => a + hOf(n), 0) + 11 * (notes.length - 1) > railH){
    dropNote(notes.reduce((a, b) => (+a.dataset.seq < +b.dataset.seq ? a : b)));
    notes = [...rail.querySelectorAll('.note')];
  }
  rail.classList.toggle('busy', notes.length > 0);
  if (!notes.length) return;

  const items = notes.map(n => {
    const t = slide.querySelector(`.an[data-tid="${n.dataset.for}"]`);
    const tr = t.getBoundingClientRect();
    return {
      note: n, term: t,
      tx: (tr.right - sr.left) / k,
      ty: (tr.top - sr.top) / k + (tr.height / k) / 2,
      want: (tr.top - sr.top) / k - railTop - 4,
      h: n.getBoundingClientRect().height / k
    };
  }).sort((a, b) => a.want - b.want);

  // 아래로 밀어 충돌 해소
  let cur = 0;
  items.forEach(it => {
    it.top = Math.max(it.want, cur);
    cur = it.top + it.h + 11;
  });
  // 넘치면 위로 되밀기
  const over = cur - 11 - railH;
  if (over > 0){
    let bound = railH;
    for (let i = items.length - 1; i >= 0; i--){
      items[i].top = Math.min(items[i].top, bound - items[i].h);
      bound = items[i].top - 11;
    }
    items.forEach(it => it.top = Math.max(0, it.top));
  }

  const ns = 'http://www.w3.org/2000/svg';
  items.forEach(it => {
    it.note.style.top = it.top + 'px';
    const x1 = it.tx + 3, y1 = it.ty;
    const x2 = railX - 2, y2 = it.top + railTop + 18;
    const mid = x1 + (x2 - x1) * 0.55;
    const d = `M${x1} ${y1} C${mid} ${y1}, ${x1 + (x2-x1)*0.45} ${y2}, ${x2} ${y2}`;

    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
    p.style.setProperty('--L', p.getTotalLength());

    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x1); c.setAttribute('cy', y1); c.setAttribute('r', 2.6);
    svg.appendChild(c);
  });
}
</script>
